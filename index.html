<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Hub</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#fff;--text:#1a1a1a;--hint:#8a8a8a;--card:#f3f4f6;--line:#e5e7eb;
        --accent:#004973;--accent-text:#fff;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;--logo:url("logo.png")}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  /* layout */
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh;max-width:1040px;margin:0 auto}
  .side{width:184px;flex:0 0 184px;background:#003349;color:#cbd2e0;display:flex;flex-direction:column;padding:10px 0}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:15px;padding:10px 12px 14px;border-bottom:1px solid #0b3a52;margin-bottom:6px}
  .brand .bt{display:flex;flex-direction:column;line-height:1.05}
  .brand small{font-weight:400;color:#9aa4b8;font-size:9.5px;letter-spacing:.3px}
  .nav{flex:1}
  .nav a{display:block;padding:11px 14px;color:#cbd2e0;cursor:pointer;font-size:13px;font-weight:600;border-left:3px solid transparent}
  .nav a:hover{background:#014a66}
  .nav a.active{background:#014a66;color:#fff;border-left-color:#0088cc}
  .nav a.hide{display:none}
  .side .foot{padding:10px 14px;border-top:1px solid #0b3a52;font-size:12px}
  .who{color:#9aa4b8;font-size:11px;margin-bottom:6px;line-height:1.4}
  .signout{color:#ff9ba0;cursor:pointer;font-weight:600}
  .main{flex:1;padding:26px 36px;max-width:760px}
  /* controls */
  h2{font-size:17px;margin:0 0 14px}
  label{display:block;font-size:12.5px;color:#374151;font-weight:600;margin:13px 0 5px}
  label .km{display:block;color:var(--hint);font-weight:400;font-size:12px}
  label .req{color:var(--accent)}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font-size:14px}
  button.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:15px;font-weight:700;cursor:pointer}
  button.primary:disabled{opacity:.5}
  .btn-sm{padding:8px 10px;border:0;border-radius:8px;font-weight:600;font-size:13px;color:#fff;cursor:pointer}
  .btn-xs{padding:6px 11px;border:0;border-radius:7px;font-weight:600;font-size:12px;color:#fff;cursor:pointer;line-height:1}
  .card{background:var(--card);border-radius:11px;padding:13px;margin-bottom:11px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .row .k{color:var(--hint);font-size:12.5px}.row .v{font-weight:600;text-align:right}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card);border-radius:11px;padding:13px}.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:11.5px;color:var(--hint)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.ok{background:rgba(22,163,74,.15);color:var(--ok)}.pill.warn{background:rgba(217,119,6,.15);color:var(--warn)}
  .pill.bad{background:rgba(220,38,38,.15);color:var(--danger)}.pill.pend{background:rgba(37,99,235,.12);color:#2563eb}
  .msg{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13.5px;display:none}.msg.show{display:block}
  .msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}.msg.bad{background:rgba(220,38,38,.12);color:var(--danger)}
  .hint{color:var(--hint);font-size:12px;margin-top:4px}.lookup{margin-top:8px;font-size:13px;min-height:18px}
  .empty{color:var(--hint);text-align:center;padding:28px 0}
  .htable{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  .htable th,.htable td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
  .htable th{color:var(--hint);font-weight:600;background:var(--card)}
  .setTab{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer}
  .setTab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .banner{background:rgba(217,119,6,.12);color:var(--warn);padding:8px 14px;font-size:12px;text-align:center}
  /* auth screen */
  #auth{max-width:380px;margin:6vh auto;padding:20px}
  #auth h1{font-size:19px;margin:0 0 4px}#auth p.sub{color:var(--hint);margin:0 0 14px;font-size:13px}
  .switch{margin-top:14px;text-align:center;font-size:13px;color:var(--hint)}.switch a{color:var(--accent);font-weight:700;cursor:pointer}
  .seg{flex:1;padding:9px;border:0;background:#fff;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
  .seg.active{background:var(--accent);color:#fff}
  @media(max-width:767px){
    .layout{flex-direction:column;max-width:none;margin:0}
    .side{flex-direction:row;align-items:center;justify-content:space-between;width:100%;flex:none;height:54px;padding:0 12px;position:sticky;top:0;z-index:40}
    .side .brand{padding:0;margin:0;border:0}
    .side .brand .bt{font-size:14px}
    .side .logo-sm{width:24px;height:24px}
    .side .foot{padding:0;margin:0;border:0;display:flex;align-items:center}
    .side .who{display:none}
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;flex:none;display:flex;flex-direction:row;background:#003349;border-top:1px solid #0b3a52;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
    .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;border-left:0;border-top:3px solid transparent;font-size:10px;line-height:1.15;text-align:center}
    .nav a.active{background:#014a66;color:#fff;border-left-color:transparent;border-top-color:#0088cc}
    .main{flex:none;max-width:none;margin:0;padding:16px 14px 82px}
  }
  .logo-lg{width:76px;height:76px;margin:0 auto;background:var(--logo) center/cover no-repeat;border-radius:18px}
  .logo-sm{width:26px;height:26px;background:var(--logo) center/cover no-repeat;border-radius:7px;flex:0 0 auto}
  #splash{position:fixed;inset:0;z-index:9999;background:#003a56;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:1;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .sl{width:160px;height:160px;background:var(--logo) center/contain no-repeat;animation:splashpop .6s ease}
  #splash .sn{color:#fff;font-weight:800;font-size:22px;letter-spacing:.3px;animation:splashpop .6s ease .05s both}
  @keyframes splashpop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('hide')"><div class="sl"></div><div class="sn">Credit Card Hub</div></div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('hide');},1800);</script>
<div class="banner" id="cfgBanner" style="display:none">⚠️ Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html</div>

<!-- AUTH -->
<div id="auth" style="display:none">
  <div style="text-align:center;margin-bottom:16px">
    <div class="logo-lg"></div>
    <div style="font-weight:800;font-size:22px;margin-top:8px">Credit Card Hub</div>
  </div>
  <h1 id="authTitle">Sign in</h1>
  <p class="sub" id="authSub">Sign in to continue</p>

  <label id="loginLabel">Email or Staff ID <span class="req">*</span></label><input id="au_login" autocomplete="username" placeholder="name@ababank.com or Staff ID">
  <div id="passRow">
    <label>Password <span class="req">*</span></label><input id="au_pass" type="password">
  </div>
  <div id="otpRow" style="display:none">
    <label>6-digit code <span class="req">*</span></label><input id="au_otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter the code from your email">
  </div>
  <div id="newpassRow" style="display:none">
    <label>New password <span class="req">*</span></label><input id="au_newpass" type="password" placeholder="At least 6 characters">
  </div>
  <button class="primary" id="authBtn">Sign in</button>
  <div id="forgotRow" style="text-align:center;margin-top:12px"><a id="toReset" style="color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer">Forgot password?</a></div>
  <div class="msg" id="authMsg"></div>
  <div class="switch" id="authSwitch"><a id="toPublic">← Back to submit</a></div>
</div>

<!-- PUBLIC SUBMIT (no login needed; teams submit here) -->
<div id="public" style="display:none;max-width:560px;margin:0 auto;padding:0 16px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px"><div class="logo-sm"></div><span>Credit Card Hub</span></div>
    <a id="toAdmin" style="color:var(--accent);font-weight:600;font-size:13px;cursor:pointer">Admin sign in</a>
  </div>
  <div id="publicMain"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <div class="side">
      <div class="brand"><div class="logo-sm"></div><span class="bt">Credit Card Hub</span></div>
      <div class="nav" id="nav">
        <a data-view="submit"    data-roles="officer,admin">📝 Submit</a>
        <a data-view="history"   data-roles="officer,admin">🕑 History</a>
        <a data-view="dashboard" data-roles="officer,admin">📊 Dashboard</a>
        <a data-view="profile"   data-roles="officer,admin">👤 Profile</a>
        <a data-view="settings"  data-roles="admin">⚙️ Settings</a>
      </div>
      <div class="foot">
        <div class="who" id="who"></div>
        <span class="signout" id="signout">Sign out</span>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
/* ===========================================================================
 * CONFIG — paste your Supabase values, and replace the dropdown options.
 * ======================================================================== */
const SUPABASE_URL      = "https://jfhqsxfkujbqqjwgmrff.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0VWIhVLqhvKZQ87a4icwmQ_bU5XhfRE";

const OPTIONS = {               // <-- replace with your real lists
  branch:     ["100", "101", "102"],
  unit:       ["Team A", "Team B", "Team C"],
  cardStatus: ["Delivered", "Not Delivered", "Returned", "Activated"]
};

/* field labels (English + Khmer subtitle) */
const F = {
  holder: ["Card Holder Name", "ឈ្មោះម្ចាស់កាត"],
  branch: ["Branch Code (Staff)", "លេខកូដសាខា"],
  dname:  ["Delivery Name", "ឈ្មោះអ្នកដឹកកាត"],
  staff:  ["Staff ID", "លេខសម្គាល់បុគ្គលិក"],
  unit:   ["Delivery by (Unit)", "ដឹកកាតដោយ (ក្រុម)"],
  date:   ["Delivery Date", "កាលបរិច្ឆេទដឹកកាត"],
  status: ["Credit Card Status", "ស្ថានភាពកាតឥណទាន"]
};
/* --------------------------------------------------------------------------- */
const tg = window.Telegram ? window.Telegram.WebApp : null; if (tg){tg.ready();tg.expand();}
let sb=null, ME=null, PROFILE=null, DEMO=false;
if (SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('YOUR_')) {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  DEMO = true; sb = makeMockClient();
  const b=document.getElementById('cfgBanner'); b.style.display='block';
  b.textContent='Demo mode — sample data, no backend. Add your Supabase keys in index.html to go live.';
}

const $ = id => document.getElementById(id);
function escHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function opts(list){ return list.map(o=>'<option>'+o+'</option>').join(''); }

/* Telegram-gated access: the public submit path goes through the tg Edge Function,
   which verifies the Telegram signature server-side. Admins (signed in) use Supabase directly. */
const EF = String(SUPABASE_URL).replace(/\/$/,'') + '/functions/v1/tg';
const IN_TG = !!(tg && tg.initData);
async function tgCall(action, extra){
  try{
    const r = await fetch(EF,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
      body:JSON.stringify(Object.assign({initData:(tg&&tg.initData)||'',action},extra))});
    return await r.json();
  }catch(e){ return {error:'Network error: '+e}; }
}
/* sign-up removed — submission is open to teams; admins are created by an admin */

/* ---------- auth screen ---------- */
let authMode='signin', RESET_EMAIL=null;
function setMode(m){authMode=m;renderAuth();}
$('toReset').onclick=()=>setMode('reset');
$('toAdmin').onclick=()=>{ $('public').style.display='none'; $('auth').style.display='block'; setMode('signin'); };
function renderAuth(){
  const m=authMode;
  $('passRow').style.display    = m==='signin'?'block':'none';
  $('otpRow').style.display     = m==='otp'?'block':'none';
  $('newpassRow').style.display = m==='otp'?'block':'none';
  $('forgotRow').style.display  = m==='signin'?'block':'none';
  $('au_login').readOnly = (m==='otp');
  $('loginLabel').innerHTML = 'Email or Staff ID <span class="req">*</span>';
  const T={signin:'Admin sign in', reset:'Reset password', otp:'Enter reset code'};
  const S={signin:'Sign in to continue', reset:"We'll email you a 6-digit code", otp:'Enter the code from your email and choose a new password'};
  const B={signin:'Sign in', reset:'Send code', otp:'Set new password & sign in'};
  $('authTitle').textContent = T[m];
  $('authSub').textContent   = S[m];
  $('authBtn').textContent   = B[m];
  $('authSwitch').innerHTML  = m==='signin' ? '<a id="toPublic">← Back to submit</a>' : '<a id="toSignin">← Back to sign in</a>';
  if($('toSignin'))$('toSignin').onclick=()=>setMode('signin');
  if($('toPublic'))$('toPublic').onclick=()=>showPublic();
}
async function resolveEmail(val){
  if(val.includes('@')) return val;
  const { data } = await sb.rpc('email_for_staff',{ p_staff_id: val });
  return data || null;
}
$('authBtn').onclick = async ()=>{
  if(!sb){ setMsg('authMsg','bad','Supabase keys not set.'); return; }
  const id=$('au_login').value.trim();
  if(authMode==='reset'){
    if(!id){ setMsg('authMsg','bad','Enter your email or Staff ID.'); return; }
    $('authBtn').disabled=true;
    const email=await resolveEmail(id);
    if(!email){ $('authBtn').disabled=false; setMsg('authMsg','bad','Staff ID not found.'); return; }
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
    $('authBtn').disabled=false;
    if(error){ setMsg('authMsg','bad',error.message); return; }
    RESET_EMAIL=email; setMode('otp');
    setMsg('authMsg','ok','We sent a 6-digit code to '+email+'. Enter it below with your new password.');
    return;
  }
  if(authMode==='otp'){
    const code=$('au_otp').value.trim();
    const np=$('au_newpass').value;
    if(!/^\d{6}$/.test(code)){ setMsg('authMsg','bad','Enter the 6-digit code from your email.'); return; }
    if(!np||np.length<6){ setMsg('authMsg','bad','New password must be at least 6 characters.'); return; }
    $('authBtn').disabled=true;
    const { error } = await sb.auth.verifyOtp({ email:RESET_EMAIL, token:code, type:'email' });
    if(error){ $('authBtn').disabled=false; setMsg('authMsg','bad', /expired|invalid/i.test(error.message)?'That code is wrong or expired. Request a new one.':error.message); return; }
    const { error:ue } = await sb.auth.updateUser({ password:np });
    $('authBtn').disabled=false;
    if(ue){ setMsg('authMsg','bad','Code accepted, but setting the password failed: '+ue.message); return; }
    try{ localStorage.setItem('cardhub_login', RESET_EMAIL); }catch(e){}
    setMsg('authMsg','ok','Password updated — signing you in…');
    return;
  }
  const pass=$('au_pass').value;
  if(!id||!pass){ setMsg('authMsg','bad','Enter your email/Staff ID and password.'); return; }
  $('authBtn').disabled=true;
  const email=await resolveEmail(id);
  if(!email){ $('authBtn').disabled=false; setMsg('authMsg','bad','Staff ID not found.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  $('authBtn').disabled=false;
  if(error){ setMsg('authMsg','bad',error.message); return; }
  try{ localStorage.setItem('cardhub_login', id); }catch(e){}
};
try{ const _rl=localStorage.getItem('cardhub_login'); if(_rl) $('au_login').value=_rl; }catch(e){}
$('signout').onclick = async ()=>{ if(sb) await sb.auth.signOut(); };

/* ---------- session ---------- */
function showPublic(){
  ME=null;PROFILE=null;
  $('app').style.display='none'; $('auth').style.display='none'; $('public').style.display='block';
  renderAuth(); viewSubmit('publicMain');
}
async function loadOptions(){
  try{
    const [b,u,s]=await Promise.all([
      sb.from('ref_branch').select('label').order('label'),
      sb.from('ref_unit').select('label').order('label'),
      sb.from('ref_card_status').select('label')
    ]);
    if(b.data&&b.data.length)OPTIONS.branch=b.data.map(r=>r.label);
    if(u.data&&u.data.length)OPTIONS.unit=u.data.map(r=>r.label);
    if(s.data&&s.data.length)OPTIONS.cardStatus=s.data.map(r=>r.label);
  }catch(e){}
}
async function boot(){
  if(!sb){ showPublic(); return; }
  await loadOptions();
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{ handleSession(s); });
  handleSession(session);
}
async function handleSession(session){
  if(!session){ showPublic(); return; }
  ME=session.user;
  const { data } = await sb.from('profiles').select('*').eq('id',ME.id).single();
  if(data && data.active===false){ await sb.auth.signOut(); popup('Your account has been deactivated. Please contact an administrator.'); showPublic(); return; }
  PROFILE = data || { role:'officer', full_name:ME.email };
  $('public').style.display='none'; $('auth').style.display='none'; $('app').style.display='block';
  $('who').innerHTML = escHtml(PROFILE.full_name||ME.email)+'<br><span class="pill pend">'+PROFILE.role+'</span>';
  setupNav();
}
function setupNav(){
  const role = PROFILE.role;
  let first=null;
  document.querySelectorAll('#nav a').forEach(a=>{
    const allowed = a.getAttribute('data-roles').split(',').includes(role);
    a.classList.toggle('hide',!allowed);
    if(allowed){ if(!first) first=a; a.onclick=()=>go(a.getAttribute('data-view')); }
  });
  if(first) go(first.getAttribute('data-view'));
}
function go(view){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('data-view')===view));
  ({submit:viewSubmit,history:viewHistory,dashboard:viewDashboard,profile:viewProfile,settings:viewSettings}[view])();
}

/* ---------- SUBMIT ---------- */
function lbl(f){ return '<label>'+f[0]+' <span class="req">*</span><span class="km">'+f[1]+'</span></label>'; }
function viewSubmit(hostId){
  const host=$(hostId||'main'); let selectedCard=null, t=null;
  if(!ME && !IN_TG){
    host.innerHTML='<div class="card" style="text-align:center;padding:30px 18px">'+
      '<div style="font-size:42px;line-height:1">📲</div>'+
      '<h2 style="margin:10px 0 6px">Open in Telegram</h2>'+
      '<p class="hint">For security, the submission form runs inside the Credit Card Hub Telegram bot. Please open it from Telegram to submit a delivery record.</p>'+
      '<p class="hint" style="margin-top:8px">Admins can sign in using “Admin sign in” at the top.</p></div>';
    return;
  }
  host.innerHTML =
    '<h2>Submit delivery record</h2>'+
    lbl(F.holder)+'<input id="f_holder" autocomplete="off" placeholder="Type to search card holder…"><div id="hResults"></div><div class="lookup" id="lookup"></div>'+
    lbl(F.branch)+'<select id="f_branch"><option value="">Select…</option>'+opts(OPTIONS.branch)+'<option value="__other">Other…</option></select>'+
      '<input id="f_branch_other" inputmode="numeric" placeholder="Enter branch code (numbers only)" style="display:none;margin-top:6px">'+
    lbl(F.dname)+'<input id="f_dname">'+
    lbl(F.staff)+'<input id="f_staff" inputmode="numeric" placeholder="Numbers only">'+
    lbl(F.unit)+'<select id="f_unit"><option value="">Select…</option>'+opts(OPTIONS.unit)+'<option value="__other">Other…</option></select>'+
      '<input id="f_unit_other" placeholder="Enter unit / team" style="display:none;margin-top:6px">'+
    lbl(F.date)+'<input id="f_date" type="date">'+
    lbl(F.status)+'<select id="f_status"><option value="">Select…</option>'+opts(OPTIONS.cardStatus)+'</select>'+
    '<label>Remark <span class="km">កំណត់សម្គាល់</span></label><textarea id="f_remark" rows="2" placeholder="Optional"></textarea>'+
    '<button class="primary" id="subBtn">Submit</button><div class="msg" id="subMsg"></div>'+
    '<p class="hint">Pick the card holder from the search list — only names in the uploaded data can be submitted, and each card can be submitted once.</p>';
  const tag=r=>(r.reason_for_reissue&&String(r.reason_for_reissue).trim())?'<span class="pill warn">Reissue</span>':'<span class="pill ok">New</span>';
  function pick(r){
    selectedCard=r; $('f_holder').value=r.cardholder_name; $('hResults').innerHTML='';
    if($('f_date')) $('f_date').min = r.create_date || '';
    $('lookup').innerHTML='<span class="pill ok">Selected</span> '+tag(r)+'<div class="card" style="margin-top:8px">'+
      kv('Card holder',r.cardholder_name)+kv('Address',r.address)+kv('Created in TWCMS',r.create_date)+kv('Reason for reissue',r.reason_for_reissue||'— (new card)')+'</div>';
  }
  $('f_holder').addEventListener('input',function(){
    const term=this.value.trim(); selectedCard=null; $('lookup').innerHTML=''; clearTimeout(t);
    if(term.length<2){$('hResults').innerHTML='';return;}
    t=setTimeout(async()=>{
      let data;
      if(ME){
        ({data}=await sb.from('merchant_card_detail')
          .select('id,cardholder_name,address,create_date,reason_for_reissue')
          .ilike('cardholder_name','%'+term+'%').limit(10));
      }else{
        const res=await tgCall('search',{q:term});
        if(res.error){$('hResults').innerHTML='<div class="hint" style="padding:6px 2px">'+escHtml(res.error)+'</div>';return;}
        data=res.data;
      }
      if(!data||!data.length){$('hResults').innerHTML='<div class="hint" style="padding:6px 2px">No match in uploaded data.</div>';return;}
      $('hResults').innerHTML='<div class="card" style="padding:4px">'+data.map((r,i)=>
        '<div class="hopt" data-i="'+i+'" style="padding:9px;border-radius:7px;cursor:pointer">'+escHtml(r.cardholder_name)+' '+tag(r)+
        ' <span class="hint">· '+escHtml(r.create_date||'')+(r.reason_for_reissue?' · '+escHtml(r.reason_for_reissue):'')+'</span></div>').join('')+'</div>';
      $('hResults').querySelectorAll('.hopt').forEach(el=>el.onclick=()=>pick(data[+el.getAttribute('data-i')]));
    },300);
  });
  $('f_branch').onchange=function(){$('f_branch_other').style.display=this.value==='__other'?'block':'none';};
  $('f_unit').onchange=function(){$('f_unit_other').style.display=this.value==='__other'?'block':'none';};
  $('subBtn').onclick=async function(){
    if(!selectedCard){ popup('Card holder name does not match the existing data. Please pick a valid card holder from the list.'); return; }
    const branch=$('f_branch').value==='__other'?$('f_branch_other').value.trim():$('f_branch').value;
    const unit=$('f_unit').value==='__other'?$('f_unit_other').value.trim():$('f_unit').value;
    const payload={
      card_ref:String(selectedCard.id), card_holder_name:selectedCard.cardholder_name,
      branch_code:branch, delivery_name:$('f_dname').value.trim(), staff_id:$('f_staff').value.trim(),
      delivery_unit:unit, delivery_date:$('f_date').value||null, delivery_card_status:$('f_status').value,
      remark:$('f_remark').value.trim()||null
    };
    for(const k of ['branch_code','delivery_name','staff_id','delivery_unit','delivery_date','delivery_card_status'])
      if(!payload[k]){ popup('Please fill in all required information before submitting.'); return; }
    if(!/^\d+$/.test(payload.branch_code)){ popup('Branch Code must be a number.'); return; }
    if(!/^\d+$/.test(payload.staff_id)){ popup('Staff ID must be a number.'); return; }
    if(selectedCard.create_date && payload.delivery_date && payload.delivery_date < selectedCard.create_date){
      popup('Delivery Date cannot be earlier than the card\'s create date ('+selectedCard.create_date+').'); return; }
    if(payload.delivery_card_status.trim().toLowerCase()!=='delivered' && !payload.remark){
      popup('Remark is required when the status is not "Delivered".'); return; }
    this.disabled=true;
    if(ME){
      const {data:dups}=await sb.from('submissions').select('delivery_name,created_at,status').eq('card_ref',payload.card_ref).limit(1);
      if(dups&&dups.length){ this.disabled=false; const d=dups[0];
        popup('This card was already submitted'+(d.delivery_name?' by '+d.delivery_name:'')+(d.created_at?' on '+new Date(d.created_at).toLocaleDateString():'')+'.'); return; }
      const {error}=await sb.from('submissions').insert(payload);
      this.disabled=false;
      if(error){ popup(subErr(error.message)); }
      else { setMsg('subMsg','ok','Submitted successfully.'); viewSubmit(hostId); }
    }else{
      const res=await tgCall('submit',{record:payload});
      this.disabled=false;
      if(res.error){ popup(res.error); }
      else { setMsg('subMsg','ok','Submitted successfully.'); viewSubmit(hostId); }
    }
  };
}

/* ---------- UPLOADER (reused inside Settings → Card Holder Name) ---------- */
function renderUploader(host,onDone){
  host.innerHTML=
    '<p class="hint">Upload the daily card list (CSV or Excel). Each row adds a card. A customer can have one <b>new</b> card (blank reason) plus any number of <b>reissues</b>. Columns: <b>cardholder_name / customer name</b> (required), address, create_date (creating in TWCMS), reason_for_reissue (blank = new).</p>'+
    '<input type="file" id="f_file" accept=".csv,.xlsx,.xls" style="margin-top:6px">'+
    '<div id="upPrev"></div>'+
    '<button class="primary" id="upBtn" disabled>Upload &amp; merge</button>'+
    '<div class="msg" id="upMsg"></div>';
  let parsed=null;
  const FIELDS=['cardholder_name','address','create_date','reason_for_reissue'];
  const MAP={cardholdername:'cardholder_name',customername:'cardholder_name',customer:'cardholder_name',name:'cardholder_name',cardholder:'cardholder_name',address:'address',location:'address',createdate:'create_date',creatingintwcms:'create_date',createdintwcms:'create_date',createddate:'create_date',twcms:'create_date',reasonforreissue:'reason_for_reissue',reissuereason:'reason_for_reissue',reason:'reason_for_reissue',reissue:'reason_for_reissue'};
  const norm=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  $('f_file').onchange=function(){
    const file=this.files&&this.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!raw.length){ popup('The file has no rows.'); return; }
      parsed=raw.map(row=>{const o={};Object.keys(row).forEach(k=>{const n=norm(k);const f=MAP[n]||(FIELDS.indexOf(n)>=0?n:null);if(f)o[f]=typeof row[k]==='string'?row[k].trim():row[k];});return o;}).filter(o=>o.cardholder_name);
      if(!parsed.length){ popup('No valid rows found. The file needs a cardholder_name (customer name) column.'); return; }
      $('upPrev').innerHTML='<div class="card" style="margin-top:10px">'+kv('Rows found',parsed.length)+kv('Sample',parsed.slice(0,3).map(p=>p.cardholder_name+(p.reason_for_reissue?' (reissue)':' (new)')).join(', '))+'</div>';
      $('upBtn').disabled=false;
    }catch(err){ popup('Could not read the file: '+err.message); } };
    r.readAsArrayBuffer(file);
  };
  $('upBtn').onclick=async function(){
    if(!parsed||!parsed.length)return; this.disabled=true; setMsg('upMsg','ok','Uploading…');
    const {data:existing}=await sb.from('merchant_card_detail').select('cardholder_name,reason_for_reissue');
    const newNames=new Set((existing||[]).filter(r=>!(r.reason_for_reissue&&String(r.reason_for_reissue).trim())).map(r=>String(r.cardholder_name).trim().toLowerCase()));
    let toInsert=[],skipped=0;
    parsed.forEach(p=>{const reason=(p.reason_for_reissue&&String(p.reason_for_reissue).trim())||null;const isNew=!reason;const key=String(p.cardholder_name).trim().toLowerCase();
      if(isNew&&newNames.has(key)){skipped++;return;} if(isNew)newNames.add(key);
      toInsert.push({cardholder_name:p.cardholder_name,address:p.address||null,create_date:p.create_date||null,reason_for_reissue:reason});});
    let error=null; if(toInsert.length){ const res=await sb.from('merchant_card_detail').insert(toInsert); error=res.error; }
    this.disabled=false;
    if(error){ setMsg('upMsg','bad',error.message); popup('Upload failed: '+error.message); }
    else { setMsg('upMsg','ok',toInsert.length+' added'+(skipped?', '+skipped+' skipped (new card already exists)':'')+'.'); $('f_file').value=''; $('upPrev').innerHTML=''; if(onDone)onDone(); }
  };
}

    }; img.src=e.target.result; }; rd.readAsDataURL(f);

  $('pSave').onclick=async function(){
    this.disabled=true;
    const upd={full_name:$('p_name').value,staff_id:$('p_staff').value,phone:$('p_phone').value};
    if(newAvatar)upd.avatar_url=newAvatar;
    const {error}=await sb.from('profiles').update(upd).eq('id',ME.id);
    let note='';
    const em=$('p_email').value.trim();
    if(!error && em && em!==(p.email||ME.email)){
      const {error:ee}=await sb.auth.updateUser({email:em});
      if(ee) note=' (email unchanged: '+ee.message+')';
      else { await sb.from('profiles').update({email:em}).eq('id',ME.id); PROFILE.email=em; note=' Check your inbox to confirm the new email.'; }
    }
    this.disabled=false;
    if(error){ setMsg('pMsg','bad',error.message); return; }
    Object.assign(PROFILE,upd); setMsg('pMsg','ok','Profile updated.'+note);
    $('who').innerHTML=escHtml(PROFILE.full_name||ME.email)+'<br><span class="pill pend">'+PROFILE.role+'</span>';
  };
}

/* ---------- helpers ---------- */
function subErr(m){ m=String(m||'');
  if(/duplicate|unique/i.test(m)) return 'This card has already been submitted.';
  if(/NO_MATCH/.test(m))   return 'Card holder does not match the existing data.';
  if(/BAD_BRANCH/.test(m)) return 'Branch Code must be a number.';
  if(/BAD_STAFF/.test(m))  return 'Staff ID must be a number.';
  if(/BAD_DATE/.test(m))   return 'Delivery Date cannot be earlier than the card\'s create date.';
  if(/NEED_REMARK/.test(m))return 'Remark is required when the status is not "Delivered".';
  return m;
}
function kv(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+(v==null||v===''?'—':escHtml(v))+'</span></div>';}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function breakdown(t,o){const ks=Object.keys(o||{});if(!ks.length)return '';return '<div class="card"><div class="k" style="font-weight:700;margin-bottom:6px">'+t+'</div>'+ks.map(k=>kv(k,o[k])).join('')+'</div>';}
function fmt(n){return (Number(n)||0).toLocaleString();}
function setMsg(id,cls,text){const m=$(id);m.className='msg show '+cls;m.textContent=text;}
function popup(msg){ if(tg&&tg.showAlert){try{tg.showAlert(String(msg));return;}catch(e){}}
  let o=$('popupBox');
  if(!o){ o=document.createElement('div'); o.id='popupBox';
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px';
    o.innerHTML='<div style="background:#fff;border-radius:12px;max-width:340px;width:100%;padding:18px;text-align:center"><div id="popupMsg" style="color:#1a1a1a;font-size:14px;line-height:1.5;margin-bottom:14px"></div><button id="popupOk" style="background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 22px;font-weight:700;cursor:pointer">OK</button></div>';
    document.body.appendChild(o); o.querySelector('#popupOk').onclick=()=>{o.style.display='none';};
  }
  $('popupMsg').textContent=String(msg); o.style.display='flex';
}
function editModal(title,fields,onSave){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2500;padding:16px';
  o.innerHTML='<div style="background:#fff;border-radius:12px;max-width:420px;width:100%;padding:18px;max-height:85vh;overflow:auto">'+
    '<div style="font-weight:700;font-size:16px;margin-bottom:4px">'+title+'</div>'+
    fields.map((f,i)=>'<label style="display:block;font-size:12.5px;color:#374151;font-weight:600;margin:10px 0 4px">'+f.label+'</label><input id="em_'+i+'" type="'+(f.type||'text')+'" value="'+escHtml(f.value)+'"'+(f.readonly?' readonly style="background:#f3f4f6"':'')+'>').join('')+
    '<div style="display:flex;gap:8px;margin-top:16px"><button id="em_cancel" class="btn-sm" style="flex:1;background:#6b7280;padding:10px">Cancel</button><button id="em_save" class="btn-sm" style="flex:1;background:var(--accent);padding:10px">Save</button></div></div>';
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.addEventListener('click',e=>{if(e.target===o)close();});
  o.querySelector('#em_cancel').onclick=close;
  o.querySelector('#em_save').onclick=async()=>{const vals={};fields.forEach((f,i)=>vals[f.key]=o.querySelector('#em_'+i).value.trim());const err=await onSave(vals);if(err)popup(err);else close();};
}

    {id:'u2',full_name:'Officer Two',email:'o2@bank',staff_id:'O102',branch_code:'002 - Branch 2',unit:'Team B',role:'officer',created_at:new Date().toISOString()},
    {id:'u3',full_name:'Officer One',email:'o1@bank',staff_id:'O201',branch_code:'001 - Head Office',unit:'Team A',role:'officer',created_at:new Date().toISOString()}
  ];
  const subs=[
    {id:1,created_at:new Date().toISOString(),submitted_by:'u2',card_ref:'1',card_holder_name:'SOK DARA',branch_code:'101',delivery_name:'Delivery One',staff_id:'1001',delivery_unit:'Team B',delivery_date:'2026-11-12',delivery_card_status:'Delivered',remark:'',status:'SUBMITTED'}
  ];
  const ref_branch=OPTIONS.branch.map((l,i)=>({id:'b'+i,label:l}));
  const ref_unit=OPTIONS.unit.map((l,i)=>({id:'u'+i,label:l}));
  const ref_card_status=OPTIONS.cardStatus.map((l,i)=>({id:'c'+i,label:l}));
  const db={merchant_card_detail:cards, submissions:subs, profiles:profiles, ref_branch:ref_branch, ref_unit:ref_unit, ref_card_status:ref_card_status};
  function run(st){
    try{
      if(st.op==='delete'){ const a=db[st.table]; if(a){for(let i=a.length-1;i>=0;i--){if(st.filters.every(([c,v])=>String(a[i][c])===String(v)))a.splice(i,1);}} return {error:null}; }
      if(st.op==='upsert'){
        const arr=Array.isArray(st.payload)?st.payload:[st.payload];
        if(st.table==='merchant_card_detail') arr.forEach(row=>{const i=row.id!=null?cards.findIndex(c=>String(c.id)===String(row.id)):-1;if(i>=0)Object.assign(cards[i],row);else cards.push(Object.assign({id:'x'+Date.now()+Math.floor(Math.random()*1000)},row));});
        return {error:null};
      }
      if(st.op==='insert'){
        const p=st.payload;
        if(st.table==='submissions'){
          const m=cards.find(c=>String(c.id)===String(p.card_ref));
          if(!m) return {error:{message:'NO_MATCH card not in uploaded data'}};
          if(subs.some(s=>String(s.card_ref)===String(p.card_ref))) return {error:{message:'duplicate: card already submitted'}};
          subs.unshift({id:Date.now(),created_at:new Date().toISOString(),submitted_by:'public',status:'SUBMITTED',card_ref:p.card_ref,
            card_holder_name:m.cardholder_name,branch_code:p.branch_code,delivery_name:p.delivery_name,staff_id:p.staff_id,
            delivery_unit:p.delivery_unit,delivery_date:p.delivery_date,delivery_card_status:p.delivery_card_status,remark:p.remark});
          return {error:null};
        }
        const arr=Array.isArray(p)?p:[p]; const a=db[st.table];
        if(st.table==='merchant_card_detail'){ for(const row of arr){ const isNew=!(row.reason_for_reissue&&String(row.reason_for_reissue).trim()); if(isNew&&cards.some(c=>String(c.cardholder_name).trim().toLowerCase()===String(row.cardholder_name).trim().toLowerCase()&&!(c.reason_for_reissue&&String(c.reason_for_reissue).trim()))) return {error:{message:'duplicate: new card already exists'}}; } }
        if(a) arr.forEach(row=>a.unshift(Object.assign({id:'x'+Date.now()+Math.floor(Math.random()*1000),created_at:new Date().toISOString()},row)));
        return {error:null};
      }
      let rows=db[st.table].slice();
      if(st.op==='update'){
        db[st.table].filter(r=>st.filters.every(([c,v])=>String(r[c])===String(v))).forEach(r=>Object.assign(r,st.payload));
        return {error:null};
      }
      st.filters.forEach(([c,v])=>rows=rows.filter(r=>String(r[c])===String(v)));
      st.ilikes.forEach(([c,v])=>{const term=String(v).replace(/%/g,'').toLowerCase();rows=rows.filter(r=>String(r[c]).toLowerCase().includes(term));});
      if(st.limitN)rows=rows.slice(0,st.limitN);
      return st.single?{data:rows[0]||null,error:null}:{data:rows,error:null};
    }catch(e){return {error:{message:String(e)}};}
  }
  function builder(table){
    const st={table,op:'select',filters:[],ilikes:[],limitN:null,single:false,payload:null};
    const api={select(){return api;},insert(p){st.op='insert';st.payload=p;return api;},upsert(p){st.op='upsert';st.payload=p;return api;},
      update(p){st.op='update';st.payload=p;return api;},delete(){st.op='delete';return api;},eq(c,v){st.filters.push([c,v]);return api;},
      ilike(c,v){st.ilikes.push([c,v]);return api;},order(){return api;},limit(n){st.limitN=n;return api;},
      single(){st.single=true;return api;},then(res){res(run(st));}};
    return api;
  }
  let _session=null,_cb=null;
  return { from:builder, auth:{
    getSession:async()=>({data:{session:_session}}),
    onAuthStateChange:(cb)=>{_cb=cb;return {data:{subscription:{unsubscribe(){}}}};},
    signInWithPassword:async({email})=>{_session={user:{id:'demo-admin',email:email||'demo@admin'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    signUp:async({email})=>{_session={user:{id:'demo-signup',email:email||'new@user'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    signOut:async()=>{_session=null;if(_cb)_cb('SIGNED_OUT',null);return {error:null};},
    resetPasswordForEmail:async()=>({error:null}),
    signInWithOtp:async()=>({error:null}),
    verifyOtp:async({email})=>{_session={user:{id:'demo-admin',email:email||'demo@admin'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    updateUser:async()=>({error:null})
  }, rpc:async(name)=>({data:(name==='email_for_staff'?'demo@admin':null),error:null}) };
}
