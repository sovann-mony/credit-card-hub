<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Hub</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--bg:#fff;--text:#1a1a1a;--hint:#8a8a8a;--card:#f3f4f6;--line:#e5e7eb;
        --accent:#004973;--accent-text:#fff;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;--logo:url("logo.png")}
  body.dark{--bg:#0f1720;--text:#e8edf2;--hint:#8b97a7;--card:#1a2330;--line:#2b3747;--accent:#2f93cc;--accent-text:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  /* layout */
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh;max-width:1560px;margin:0 auto}
  .side{width:210px;flex:0 0 210px;background:#003349;color:#cbd2e0;display:flex;flex-direction:column;padding:10px 0}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:15px;padding:10px 12px 14px;border-bottom:1px solid #0b3a52;margin-bottom:6px}
  .brand .bt{display:flex;flex-direction:column;line-height:1.05}
  .brand small{font-weight:400;color:#9aa4b8;font-size:9.5px;letter-spacing:.3px}
  .nav{flex:1}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 16px;color:#cbd2e0;cursor:pointer;font-size:13.5px;font-weight:600;border-left:3px solid transparent}
  .nav a .ic{font-size:16px;line-height:1;width:20px;text-align:center}
  .nav a .lb{flex:1}
  .nav a:hover{background:#014a66}
  .nav a.active{background:#014a66;color:#fff;border-left-color:#0088cc}
  .nav a.hide{display:none}
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:30}
  .tb-brand{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--text)}
  .tb-right{display:flex;align-items:center;gap:14px;margin-left:auto}
  .themebtn{width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:50%;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text)}
  .userchip{display:flex;align-items:center;gap:10px}
  .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--card)}
  .ubx{display:flex;flex-direction:column;line-height:1.2}
  .uname{font-weight:700;font-size:13.5px;color:var(--text)}
  .urole{font-size:11px;color:var(--hint);text-transform:capitalize}
  .signout{color:var(--danger);cursor:pointer;font-weight:600;font-size:13px}
  /* content stretches to the same right edge as the top bar (Sign out) */
  .main{flex:1;padding:28px 24px 28px 44px;width:100%;margin:0}
  /* searchable dropdown (Branch Code) */
  .combo{position:relative}
  .combo-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:240px;overflow:auto;z-index:40}
  .combo-list.open{display:block}
  .combo-opt{padding:9px 11px;cursor:pointer;font-size:14px}
  .combo-opt:hover,.combo-opt.on{background:var(--card)}
  .combo-empty{padding:9px 11px;color:var(--hint);font-size:12.5px}
  /* profile view */
  .pf-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .pf-head img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--card)}
  .perm td.y{color:var(--ok);font-weight:700}.perm td.n{color:var(--danger);font-weight:700}
  /* controls */
  h2{font-size:17px;margin:0 0 14px}
  label{display:block;font-size:12.5px;color:#374151;font-weight:600;margin:13px 0 5px}
  label .km{display:block;color:var(--hint);font-weight:400;font-size:12px}
  label .req{color:var(--accent)}
  input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font-size:14px}
  button.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:15px;font-weight:700;cursor:pointer}
  button.primary:disabled{opacity:.5}
  .btn-sm{padding:8px 10px;border:0;border-radius:8px;font-weight:600;font-size:13px;color:#fff;cursor:pointer}
  .btn-xs{padding:6px 11px;border:0;border-radius:7px;font-weight:600;font-size:12px;color:#fff;cursor:pointer;line-height:1}
  .card{background:var(--card);border-radius:11px;padding:13px;margin-bottom:11px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .row .k{color:var(--hint);font-size:12.5px}.row .v{font-weight:600;text-align:right}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card);border-radius:11px;padding:13px}.stat .n{font-size:22px;font-weight:700}.stat .l{font-size:11.5px;color:var(--hint)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.ok{background:rgba(22,163,74,.15);color:var(--ok)}.pill.warn{background:rgba(217,119,6,.15);color:var(--warn)}
  .pill.bad{background:rgba(220,38,38,.15);color:var(--danger)}.pill.pend{background:rgba(37,99,235,.12);color:#2563eb}
  .msg{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13.5px;display:none}.msg.show{display:block}
  .msg.ok{background:rgba(22,163,74,.12);color:var(--ok)}.msg.bad{background:rgba(220,38,38,.12);color:var(--danger)}
  .hint{color:var(--hint);font-size:12px;margin-top:4px}.lookup{margin-top:8px;font-size:13px;min-height:18px}
  .empty{color:var(--hint);text-align:center;padding:28px 0}
  .htable{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  .htable th,.htable td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
  .htable th{color:var(--hint);font-weight:600;background:var(--card)}
  .setTab{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer}
  .setTab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .banner{background:rgba(217,119,6,.12);color:var(--warn);padding:8px 14px;font-size:12px;text-align:center}
  /* auth screen */
  #auth{max-width:380px;margin:6vh auto;padding:20px}
  #auth h1{font-size:19px;margin:0 0 4px}#auth p.sub{color:var(--hint);margin:0 0 14px;font-size:13px}
  .switch{margin-top:14px;text-align:center;font-size:13px;color:var(--hint)}.switch a{color:var(--accent);font-weight:700;cursor:pointer}
  .seg{flex:1;padding:9px;border:0;background:#fff;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
  .seg.active{background:var(--accent);color:#fff}
  @media(max-width:767px){
    .layout{flex-direction:column;max-width:none;margin:0}
    .side{flex:none;width:100%;height:0;padding:0;background:none}
    .side .brand{display:none}
    .topbar{padding:9px 14px}
    .tb-brand{display:flex}
    .tb-brand .logo-sm{width:24px;height:24px}
    .tb-right{gap:10px}
    .userchip .ubx{display:none}
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;flex:none;display:flex;flex-direction:row;background:#003349;border-top:1px solid #0b3a52;box-shadow:0 -2px 10px rgba(0,0,0,.25);padding:0}
    .nav a{flex:1;flex-direction:column;gap:3px;padding:8px 2px;border-left:0;border-top:3px solid transparent;font-size:10px;line-height:1.1;text-align:center}
    .nav a .ic{font-size:20px;width:auto}
    .nav a .lb{flex:none}
    .nav a.active{background:#014a66;color:#fff;border-left-color:transparent;border-top-color:#0088cc}
    .main{flex:none;max-width:none;margin:0;padding:16px 14px 82px}
  }
  .logo-lg{width:76px;height:76px;margin:0 auto;background:var(--logo) center/cover no-repeat;border-radius:18px}
  .logo-sm{width:26px;height:26px;background:var(--logo) center/cover no-repeat;border-radius:7px;flex:0 0 auto}
  #splash{position:fixed;inset:0;z-index:9999;background:#003a56;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:1;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .sl{width:160px;height:160px;background:var(--logo) center/contain no-repeat;animation:splashpop .6s ease}
  #splash .sn{color:#fff;font-weight:800;font-size:22px;letter-spacing:.3px;animation:splashpop .6s ease .05s both}
  @keyframes splashpop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('hide')"><div class="sl"></div><div class="sn">Credit Card Hub</div></div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('hide');},1800);</script>
<div class="banner" id="cfgBanner" style="display:none">⚠️ Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of index.html</div>

<!-- AUTH -->
<div id="auth" style="display:none">
  <div style="text-align:center;margin-bottom:16px">
    <div class="logo-lg"></div>
    <div style="font-weight:800;font-size:22px;margin-top:8px">Credit Card Hub</div>
  </div>
  <h1 id="authTitle">Sign in</h1>
  <p class="sub" id="authSub">Sign in to continue</p>

  <label id="loginLabel">Email or Staff ID <span class="req">*</span></label><input id="au_login" autocomplete="username" placeholder="name@ababank.com or Staff ID">
  <div id="passRow">
    <label>Password <span class="req">*</span></label><input id="au_pass" type="password">
  </div>
  <div id="otpRow" style="display:none">
    <label>6-digit code <span class="req">*</span></label><input id="au_otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter the code from your email">
  </div>
  <div id="newpassRow" style="display:none">
    <label>New password <span class="req">*</span></label><input id="au_newpass" type="password" placeholder="At least 6 characters">
  </div>
  <button class="primary" id="authBtn">Sign in</button>
  <div id="forgotRow" style="text-align:center;margin-top:12px"><a id="toReset" style="color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer">Forgot password?</a></div>
  <div class="msg" id="authMsg"></div>
  <div class="switch" id="authSwitch"><a id="toPublic">← Back to submit</a></div>
</div>

<!-- PUBLIC SUBMIT (no login needed; teams submit here) -->
<div id="public" style="display:none;max-width:560px;margin:0 auto;padding:0 16px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px"><div class="logo-sm"></div><span>Credit Card Hub</span></div>
    <a id="toAdmin" style="color:var(--accent);font-weight:600;font-size:13px;cursor:pointer">Sign in</a>
  </div>
  <div id="publicMain"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <div class="side">
      <div class="brand"><div class="logo-sm"></div><span class="bt">Credit Card Hub</span></div>
      <div class="nav" id="nav">
        <a data-view="submit"    data-roles="officer,admin"><span class="ic">📝</span><span class="lb">Submit</span></a>
        <a data-view="history"   data-roles="officer,admin"><span class="ic">🕑</span><span class="lb">History</span></a>
        <a data-view="cards"     data-roles="officer,admin"><span class="ic">💳</span><span class="lb">Card Data</span></a>
        <a data-view="dashboard" data-roles="officer,admin"><span class="ic">📊</span><span class="lb">Dashboard</span></a>
        <a data-view="profile"   data-roles="officer,admin"><span class="ic">👤</span><span class="lb">Profile</span></a>
        <a data-view="settings"  data-roles="admin"><span class="ic">⚙️</span><span class="lb">Settings</span></a>
      </div>
    </div>
    <div class="content">
      <div class="topbar">
        <div class="tb-brand"><div class="logo-sm"></div><span>Credit Card Hub</span></div>
        <div class="tb-right">
          <button class="themebtn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle theme">🌙</button>
          <div class="userchip">
            <img class="avatar" id="tbAvatar" alt="">
            <div class="ubx"><div class="uname" id="uname"></div><div class="urole" id="urole"></div></div>
          </div>
          <span class="signout" id="signout">Sign out</span>
        </div>
      </div>
      <div class="main" id="main"></div>
    </div>
  </div>
</div>

<script>
/* ===========================================================================
 * CONFIG — paste your Supabase values, and replace the dropdown options.
 * ======================================================================== */
const SUPABASE_URL      = "https://jfhqsxfkujbqqjwgmrff.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0VWIhVLqhvKZQ87a4icwmQ_bU5XhfRE";

const OPTIONS = {               // <-- replace with your real lists
  branch:     ["100", "101", "102"],
  unit:       ["Team A", "Team B", "Team C"],
  cardStatus: ["Delivered", "Not Delivered", "Returned", "Activated", "On Hold"]
};

/* field labels (English + Khmer subtitle) */
const F = {
  holder: ["Card Holder Name", "ឈ្មោះម្ចាស់កាត"],
  branch: ["Branch Code (Staff)", "លេខកូដសាខា"],
  dname:  ["Delivery Name", "ឈ្មោះអ្នកដឹកកាត"],
  staff:  ["Staff ID", "លេខសម្គាល់បុគ្គលិក"],
  unit:   ["Delivery by (Unit)", "ដឹកកាតដោយ (ក្រុម)"],
  date:   ["Delivery Date", "កាលបរិច្ឆេទដឹកកាត"],
  status: ["Credit Card Status", "ស្ថានភាពកាតឥណទាន"]
};
/* --------------------------------------------------------------------------- */
const tg = window.Telegram ? window.Telegram.WebApp : null; if (tg){tg.ready();tg.expand();}
let sb=null, ME=null, PROFILE=null, DEMO=false;
const AV_PH="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='%23e5e7eb'/><circle cx='40' cy='31' r='15' fill='%239aa3b2'/><rect x='17' y='49' width='46' height='32' rx='16' fill='%239aa3b2'/></svg>";
if (SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('YOUR_')) {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  DEMO = true; sb = makeMockClient();
  const b=document.getElementById('cfgBanner'); b.style.display='block';
  b.textContent='Demo mode — sample data, no backend. Add your Supabase keys in index.html to go live.';
}

const $ = id => document.getElementById(id);
function escHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function opts(list){ return list.map(o=>'<option>'+o+'</option>').join(''); }

/* Telegram-gated access: the public submit path goes through the tg Edge Function,
   which verifies the Telegram signature server-side. Admins (signed in) use Supabase directly. */
const EF = String(SUPABASE_URL).replace(/\/$/,'') + '/functions/v1/tg';
const IN_TG = !!(tg && tg.initData);
async function tgCall(action, extra){
  try{
    const r = await fetch(EF,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
      body:JSON.stringify(Object.assign({initData:(tg&&tg.initData)||'',action},extra))});
    return await r.json();
  }catch(e){ return {error:'Network error: '+e}; }
}
/* sign-up removed — submission is open to teams; admins are created by an admin */

/* ---------- auth screen ---------- */
let authMode='signin', RESET_EMAIL=null;
function setMode(m){authMode=m;renderAuth();}
$('toReset').onclick=()=>setMode('reset');
$('toAdmin').onclick=()=>{ $('public').style.display='none'; $('auth').style.display='block'; setMode('signin'); };
function renderAuth(){
  const m=authMode;
  $('passRow').style.display    = m==='signin'?'block':'none';
  $('otpRow').style.display     = m==='otp'?'block':'none';
  $('newpassRow').style.display = m==='otp'?'block':'none';
  $('forgotRow').style.display  = m==='signin'?'block':'none';
  $('au_login').readOnly = (m==='otp');
  $('loginLabel').innerHTML = 'Email or Staff ID <span class="req">*</span>';
  const T={signin:'Sign in', reset:'Reset password', otp:'Enter reset code'};
  const S={signin:'Sign in to continue', reset:"We'll email you a 6-digit code", otp:'Enter the code from your email and choose a new password'};
  const B={signin:'Sign in', reset:'Send code', otp:'Set new password & sign in'};
  $('authTitle').textContent = T[m];
  $('authSub').textContent   = S[m];
  $('authBtn').textContent   = B[m];
  $('authSwitch').innerHTML  = m==='signin' ? '<a id="toPublic">← Back to submit</a>' : '<a id="toSignin">← Back to sign in</a>';
  if($('toSignin'))$('toSignin').onclick=()=>setMode('signin');
  if($('toPublic'))$('toPublic').onclick=()=>showPublic();
}
async function resolveEmail(val){
  if(val.includes('@')) return val;
  const { data } = await sb.rpc('email_for_staff',{ p_staff_id: val });
  return data || null;
}
$('authBtn').onclick = async ()=>{
  if(!sb){ setMsg('authMsg','bad','Supabase keys not set.'); return; }
  const id=$('au_login').value.trim();
  if(authMode==='reset'){
    if(!id){ setMsg('authMsg','bad','Enter your email or Staff ID.'); return; }
    $('authBtn').disabled=true;
    const email=await resolveEmail(id);
    if(!email){ $('authBtn').disabled=false; setMsg('authMsg','bad','Staff ID not found.'); return; }
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
    $('authBtn').disabled=false;
    if(error){ setMsg('authMsg','bad',error.message); return; }
    RESET_EMAIL=email; setMode('otp');
    setMsg('authMsg','ok','We sent a 6-digit code to '+email+'. Enter it below with your new password.');
    return;
  }
  if(authMode==='otp'){
    const code=$('au_otp').value.trim();
    const np=$('au_newpass').value;
    if(!/^\d{6}$/.test(code)){ setMsg('authMsg','bad','Enter the 6-digit code from your email.'); return; }
    if(!np||np.length<6){ setMsg('authMsg','bad','New password must be at least 6 characters.'); return; }
    $('authBtn').disabled=true;
    const { error } = await sb.auth.verifyOtp({ email:RESET_EMAIL, token:code, type:'email' });
    if(error){ $('authBtn').disabled=false; setMsg('authMsg','bad', /expired|invalid/i.test(error.message)?'That code is wrong or expired. Request a new one.':error.message); return; }
    const { error:ue } = await sb.auth.updateUser({ password:np });
    $('authBtn').disabled=false;
    if(ue){ setMsg('authMsg','bad','Code accepted, but setting the password failed: '+ue.message); return; }
    try{ localStorage.setItem('cardhub_login', RESET_EMAIL); }catch(e){}
    setMsg('authMsg','ok','Password updated — signing you in…');
    return;
  }
  const pass=$('au_pass').value;
  if(!id||!pass){ setMsg('authMsg','bad','Enter your email/Staff ID and password.'); return; }
  $('authBtn').disabled=true;
  const email=await resolveEmail(id);
  if(!email){ $('authBtn').disabled=false; setMsg('authMsg','bad','Staff ID not found.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  $('authBtn').disabled=false;
  if(error){ setMsg('authMsg','bad',error.message); return; }
  try{ localStorage.setItem('cardhub_login', id); }catch(e){}
};
try{ const _rl=localStorage.getItem('cardhub_login'); if(_rl) $('au_login').value=_rl; }catch(e){}
/* Enter in any sign-in field = click the Sign in / Send code / Set password button */
['au_login','au_pass','au_otp','au_newpass'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!$('authBtn').disabled){ e.preventDefault(); $('authBtn').click(); } }); });
$('signout').onclick = async ()=>{ if(sb) await sb.auth.signOut(); };

/* ---------- session ---------- */
function showPublic(){
  ME=null;PROFILE=null;
  $('app').style.display='none'; $('auth').style.display='none'; $('public').style.display='block';
  renderAuth(); viewSubmit('publicMain');
}
async function loadOptions(){
  try{
    const [b,u,s]=await Promise.all([
      sb.from('ref_branch').select('label').order('label'),
      sb.from('ref_unit').select('label').order('label'),
      sb.from('ref_card_status').select('label')
    ]);
    if(b.data&&b.data.length)OPTIONS.branch=b.data.map(r=>r.label);
    if(u.data&&u.data.length)OPTIONS.unit=u.data.map(r=>r.label);
    if(s.data&&s.data.length)OPTIONS.cardStatus=s.data.map(r=>r.label);
  }catch(e){}
}
async function boot(){
  if(!sb){ showPublic(); return; }
  await loadOptions();
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{ handleSession(s); });
  handleSession(session);
}
/* Supabase re-fires SIGNED_IN / TOKEN_REFRESHED when you come back to the tab.
   Only rebuild the app when the signed-in user actually changes, so the current
   page (and anything typed into it) is kept. */
let CUR_UID=null;
async function handleSession(session){
  if(!session){ CUR_UID=null; showPublic(); return; }
  if(CUR_UID===session.user.id){ ME=session.user; return; }
  CUR_UID=session.user.id;
  ME=session.user;
  const { data } = await sb.from('profiles').select('*').eq('id',ME.id).single();
  if(data && data.active===false){ CUR_UID=null; await sb.auth.signOut(); popup('Your account has been deactivated. Please contact an administrator.'); showPublic(); return; }
  PROFILE = data || { role:'officer', full_name:ME.email };
  $('public').style.display='none'; $('auth').style.display='none'; $('app').style.display='block';
  $('uname').textContent = PROFILE.full_name||ME.email;
  $('urole').textContent = PROFILE.role||'';
  $('tbAvatar').src = PROFILE.avatar_url||AV_PH;
  setupNav();
}
function setupNav(){
  const role = PROFILE.role;
  let first=null;
  document.querySelectorAll('#nav a').forEach(a=>{
    const allowed = a.getAttribute('data-roles').split(',').includes(role);
    a.classList.toggle('hide',!allowed);
    if(allowed){ if(!first) first=a; a.onclick=()=>go(a.getAttribute('data-view')); }
  });
  if(first) go(first.getAttribute('data-view'));
}
function go(view){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('data-view')===view));
  ({submit:viewSubmit,history:viewHistory,cards:viewCards,dashboard:viewDashboard,profile:viewProfile,settings:viewSettings}[view])();
}

function submitSingle(host){
  let selectedCard=null, t=null;
  host.innerHTML =
    lbl(F.holder)+'<input id="f_holder" autocomplete="off" placeholder="Type to search card holder…"><div id="hResults"></div><div class="lookup" id="lookup"></div>'+
    lbl(F.branch)+'<div class="combo"><input id="f_branch" inputmode="numeric" autocomplete="off" placeholder="Type to search branch code (or enter a new one)"><div class="combo-list" id="f_branch_list"></div></div>'+
    lbl(F.dname)+'<input id="f_dname">'+
    lbl(F.staff)+'<input id="f_staff" inputmode="numeric" placeholder="Numbers only">'+
    lbl(F.unit)+'<select id="f_unit"><option value="">Select…</option>'+opts(OPTIONS.unit)+'<option value="__other">Other…</option></select>'+
      '<input id="f_unit_other" placeholder="Enter unit / team" style="display:none;margin-top:6px">'+
    lbl(F.date)+'<input id="f_date" type="date">'+
    lbl(F.status)+'<select id="f_status"><option value="">Select…</option>'+opts(OPTIONS.cardStatus)+'</select>'+
    '<label>Remark <span class="km">កំណត់សម្គាល់</span></label><textarea id="f_remark" rows="2" placeholder="Optional"></textarea>'+
    '<button class="primary" id="subBtn">Submit</button><div class="msg" id="subMsg"></div>'+
    '<p class="hint">Pick the card holder from the search list — only names in the uploaded data can be submitted, and each card can be submitted once.</p>';
  const tag=r=>(r.reason_for_reissue&&String(r.reason_for_reissue).trim())?'<span class="pill warn">Reissue</span>':'<span class="pill ok">New</span>';
  function pick(r){
    selectedCard=r; $('f_holder').value=r.cardholder_name; $('hResults').innerHTML='';
    if($('f_date')) $('f_date').min = r.create_date || '';   // delivery date can't precede the card's create date
    $('lookup').innerHTML='<span class="pill ok">Selected</span> '+tag(r)+'<div class="card" style="margin-top:8px">'+
      kv('Card holder',r.cardholder_name)+kv('Address',r.address)+kv('Created in TWCMS',r.create_date)+kv('Reason for reissue',r.reason_for_reissue||'— (new card)')+'</div>';
  }
  $('f_holder').addEventListener('input',function(){
    const term=this.value.trim(); selectedCard=null; $('lookup').innerHTML=''; clearTimeout(t);
    if(term.length<2){$('hResults').innerHTML='';return;}
    t=setTimeout(async()=>{
      let data;
      if(ME){
        ({data}=await sb.from('merchant_card_detail')
          .select('id,cardholder_name,address,create_date,reason_for_reissue')
          .ilike('cardholder_name','%'+term+'%').limit(10));
        // hide cards already submitted, unless their latest submission is "On Hold"
        if(data&&data.length){
          const ids=data.map(r=>String(r.id));
          const {data:subs}=await sb.from('submissions').select('card_ref,delivery_card_status,created_at').in('card_ref',ids);
          const L=latestByRef(subs);
          data=data.filter(r=>{const l=L[String(r.id)];return !l||String(l.delivery_card_status||'').trim().toLowerCase()==='on hold';});
        }
      }else{
        const res=await tgCall('search',{q:term});
        if(res.error){$('hResults').innerHTML='<div class="hint" style="padding:6px 2px">'+escHtml(res.error)+'</div>';return;}
        data=res.data;
      }
      if(!data||!data.length){$('hResults').innerHTML='<div class="hint" style="padding:6px 2px">No match in uploaded data.</div>';return;}
      $('hResults').innerHTML='<div class="card" style="padding:4px">'+data.map((r,i)=>
        '<div class="hopt" data-i="'+i+'" style="padding:9px;border-radius:7px;cursor:pointer">'+escHtml(r.cardholder_name)+' '+tag(r)+
        ' <span class="hint">· '+escHtml(r.create_date||'')+(r.reason_for_reissue?' · '+escHtml(r.reason_for_reissue):'')+'</span></div>').join('')+'</div>';
      $('hResults').querySelectorAll('.hopt').forEach(el=>el.onclick=()=>pick(data[+el.getAttribute('data-i')]));
    },300);
  });
  comboBox($('f_branch'),$('f_branch_list'),()=>OPTIONS.branch);
  $('f_unit').onchange=function(){$('f_unit_other').style.display=this.value==='__other'?'block':'none';};
  $('subBtn').onclick=async function(){
    if(!selectedCard){ popup('Card holder name does not match the existing data. Please pick a valid card holder from the list.'); return; }
    const branch=$('f_branch').value.trim();
    const unit=$('f_unit').value==='__other'?$('f_unit_other').value.trim():$('f_unit').value;
    const payload={
      card_ref:String(selectedCard.id), card_holder_name:selectedCard.cardholder_name,
      branch_code:branch, delivery_name:$('f_dname').value.trim(), staff_id:$('f_staff').value.trim(),
      delivery_unit:unit, delivery_date:$('f_date').value||null, delivery_card_status:$('f_status').value,
      remark:$('f_remark').value.trim()||null
    };
    for(const k of ['branch_code','delivery_name','staff_id','delivery_unit','delivery_date','delivery_card_status'])
      if(!payload[k]){ popup('Please fill in all required information before submitting.'); return; }
    if(!/^\d+$/.test(payload.branch_code)){ popup('Branch Code must be a number.'); return; }
    if(!/^\d+$/.test(payload.staff_id)){ popup('Staff ID must be a number.'); return; }
    if(selectedCard.create_date && payload.delivery_date && payload.delivery_date < selectedCard.create_date){
      popup('Delivery Date cannot be earlier than the card\'s create date ('+selectedCard.create_date+').'); return; }
    if(payload.delivery_card_status.trim().toLowerCase()!=='delivered' && !payload.remark){
      popup('Remark is required when the status is not "Delivered".'); return; }
    this.disabled=true;
    if(ME){
      const {data:dups}=await sb.from('submissions').select('delivery_name,created_at,delivery_card_status').eq('card_ref',payload.card_ref).order('created_at',{ascending:false}).limit(1);
      if(dups&&dups.length && String(dups[0].delivery_card_status||'').trim().toLowerCase()!=='on hold'){ this.disabled=false; const d=dups[0];
        popup('This card was already submitted'+(d.delivery_name?' by '+d.delivery_name:'')+(d.created_at?' on '+new Date(d.created_at).toLocaleDateString():'')+'. Only "On Hold" cards can be submitted again.'); return; }
      const {error}=await sb.from('submissions').insert(payload);
      this.disabled=false;
      if(error){ popup(subErr(error.message)); }
      else { setMsg('subMsg','ok','Submitted successfully.'); submitSingle(host); }
    }else{
      const res=await tgCall('submit',{record:payload});
      this.disabled=false;
      if(res.error){ popup(res.error); }
      else { setMsg('subMsg','ok','Submitted successfully.'); submitSingle(host); }
    }
  };
}

function submitUploader(host){
  host.innerHTML=
    '<p class="hint">Upload a CSV or Excel file — each row becomes one delivery record. Required columns: <b>cardholder_name</b> (must match Card Data), <b>branch_code</b> (number), <b>delivery_name</b>, <b>staff_id</b> (number), <b>delivery_unit</b>, <b>delivery_date</b> (YYYY-MM-DD, not before the card create date), <b>delivery_card_status</b>. Optional: <b>remark</b> (required unless status is Delivered), <b>reason_for_reissue</b> (to pick a specific card when a name has more than one).</p>'+
    '<input type="file" id="s_file" accept=".csv,.xlsx,.xls" style="margin-top:6px">'+
    '<div id="sPrev"></div>'+
    '<button class="primary" id="sUpBtn" disabled>Validate &amp; submit</button>'+
    '<div class="msg" id="sUpMsg"></div><div id="sUpResult"></div>';
  let parsed=null;
  const MAP={cardholdername:'cardholder_name',customername:'cardholder_name',customer:'cardholder_name',name:'cardholder_name',cardholder:'cardholder_name',
    branchcode:'branch_code',branch:'branch_code',branchcodestaff:'branch_code',
    deliveryname:'delivery_name',dname:'delivery_name',
    staffid:'staff_id',staff:'staff_id',
    deliveryunit:'delivery_unit',unit:'delivery_unit',deliveryby:'delivery_unit',deliverybyunit:'delivery_unit',team:'delivery_unit',
    deliverydate:'delivery_date',date:'delivery_date',
    deliverycardstatus:'delivery_card_status',cardstatus:'delivery_card_status',status:'delivery_card_status',
    remark:'remark',note:'remark',notes:'remark',comment:'remark',
    reasonforreissue:'reason_for_reissue',reissuereason:'reason_for_reissue',reason:'reason_for_reissue',reissue:'reason_for_reissue'};
  const norm=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  const fmtDate=v=>{ if(v==null||v==='')return ''; if(v instanceof Date){const p=n=>String(n).padStart(2,'0');return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());} const s=String(v).trim(); const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m){const p=n=>String(n).padStart(2,'0');return m[1]+'-'+p(m[2])+'-'+p(m[3]);} return s; };
  $('s_file').onchange=function(){
    const file=this.files&&this.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
      if(!raw.length){ popup('The file has no rows.'); return; }
      parsed=raw.map(row=>{const o={};Object.keys(row).forEach(k=>{const f=MAP[norm(k)];if(!f)return;let val=row[k];if(f==='delivery_date'||val instanceof Date)val=fmtDate(val);else val=typeof val==='string'?val.trim():String(val).trim();o[f]=val;});return o;}).filter(o=>o.cardholder_name);
      if(!parsed.length){ popup('No valid rows found. The file needs a cardholder_name column.'); return; }
      $('sPrev').innerHTML='<div class="card" style="margin-top:10px">'+kv('Rows found',parsed.length)+kv('Sample',parsed.slice(0,3).map(p=>p.cardholder_name).join(', '))+'</div>';
      $('sUpBtn').disabled=false; $('sUpResult').innerHTML='';
    }catch(err){ popup('Could not read the file: '+err.message); } };
    r.readAsArrayBuffer(file);
  };
  $('sUpBtn').onclick=async function(){
    if(!parsed||!parsed.length)return; this.disabled=true; setMsg('sUpMsg','ok','Submitting '+parsed.length+' record(s)…');
    const {data:cards,error:cErr}=await sb.from('merchant_card_detail').select('id,cardholder_name,create_date,reason_for_reissue');
    if(cErr){ this.disabled=false; setMsg('sUpMsg','bad',cErr.message); return; }
    const {data:allSubs}=await sb.from('submissions').select('card_ref,delivery_card_status,created_at');
    const LATEST=latestByRef(allSubs);
    const byName={}; (cards||[]).forEach(c=>{const k=String(c.cardholder_name).trim().toLowerCase();(byName[k]=byName[k]||[]).push(c);});
    const reqd=['branch_code','delivery_name','staff_id','delivery_unit','delivery_date','delivery_card_status'];
    let ok=0; const fails=[];
    for(let i=0;i<parsed.length;i++){ const p=parsed[i], rowno=i+2, name=String(p.cardholder_name).trim();
      const cands=byName[name.toLowerCase()]||[]; let card=null;
      if(cands.length===0){ fails.push([rowno,name,'Card holder not found in Card Data']); continue; }
      if(cands.length===1){ card=cands[0]; }
      else { const want=(p.reason_for_reissue&&String(p.reason_for_reissue).trim().toLowerCase())||'';
        const match=cands.filter(c=>((c.reason_for_reissue&&String(c.reason_for_reissue).trim().toLowerCase())||'')===want);
        if(match.length===1)card=match[0]; else { fails.push([rowno,name,cands.length+' cards for this name — add a reason_for_reissue column to pick one']); continue; } }
      const lsub=LATEST[String(card.id)];
      if(lsub && String(lsub.delivery_card_status||'').trim().toLowerCase()!=='on hold'){ fails.push([rowno,name,'Already submitted — only "On Hold" cards can be submitted again']); continue; }
      const miss=reqd.filter(k=>!p[k]); if(miss.length){ fails.push([rowno,name,'Missing: '+miss.join(', ')]); continue; }
      if(!/^\d+$/.test(String(p.branch_code))){ fails.push([rowno,name,'Branch Code must be a number']); continue; }
      if(!/^\d+$/.test(String(p.staff_id))){ fails.push([rowno,name,'Staff ID must be a number']); continue; }
      if(card.create_date && p.delivery_date < card.create_date){ fails.push([rowno,name,'Delivery Date earlier than card create date ('+card.create_date+')']); continue; }
      if(String(p.delivery_card_status).trim().toLowerCase()!=='delivered' && !(p.remark&&String(p.remark).trim())){ fails.push([rowno,name,'Remark required when status is not Delivered']); continue; }
      const payload={card_ref:String(card.id),card_holder_name:card.cardholder_name,branch_code:String(p.branch_code),delivery_name:String(p.delivery_name),staff_id:String(p.staff_id),delivery_unit:String(p.delivery_unit),delivery_date:p.delivery_date,delivery_card_status:String(p.delivery_card_status),remark:(p.remark&&String(p.remark).trim())||null};
      const {error}=await sb.from('submissions').insert(payload);
      if(error){ fails.push([rowno,name,subErr(error.message)]); } else ok++;
    }
    this.disabled=false;
    setMsg('sUpMsg', fails.length?'bad':'ok', ok+' submitted'+(fails.length?', '+fails.length+' failed':'')+'.');
    $('sUpResult').innerHTML = fails.length? '<div style="overflow-x:auto;margin-top:10px"><table class="htable"><thead><tr><th>Row</th><th>Card holder</th><th>Not submitted — reason</th></tr></thead><tbody>'+fails.map(f=>'<tr><td>'+f[0]+'</td><td>'+escHtml(f[1])+'</td><td>'+escHtml(f[2])+'</td></tr>').join('')+'</tbody></table></div>' : '<div class="card" style="margin-top:10px;text-align:center">All records submitted. 🎉</div>';
    if(ok){ $('s_file').value=''; parsed=null; $('sPrev').innerHTML=''; $('sUpBtn').disabled=true; }
  };
}
async function viewHistory(){
  $('main').innerHTML='<h2>History</h2><div id="histBar"></div><div id="hist"><div class="empty">Loading…</div></div>';
  let ALL=[];
  // Filter bar is built once; the lists combine the Settings options with values already used.
  $('histBar').innerHTML=filterBar('h',[...new Set(OPTIONS.unit)].sort(),[...new Set(OPTIONS.cardStatus)].sort());
  const head=['Date','Card holder','Delivery name','Staff ID','Branch','Unit','Delivery date','Card status','Remark','Status'];
  const td=v=>'<td>'+(v==null||v===''?'—':escHtml(v))+'</td>';
  function addMissing(selId,vals){ const sel=$(selId); const have=new Set([...sel.options].map(o=>o.value));
    vals.filter(v=>v&&!have.has(v)).forEach(v=>{const o=document.createElement('option');o.textContent=v;sel.appendChild(o);}); }
  async function load(){
    $('hist').innerHTML='<div class="empty">Loading…</div>';
    const {data,error}=await sb.from('submissions').select('*').order('created_at',{ascending:false});
    if(error){$('hist').innerHTML='<div class="empty">'+escHtml(error.message)+'</div>';return;}
    ALL=data||[];
    addMissing('hUnit',ALL.map(s=>s.delivery_unit)); addMissing('hStatus',ALL.map(s=>s.delivery_card_status));
    render();
  }
  function current(){
    const f=$('hFrom').value,t=$('hTo').value,u=$('hUnit').value,st=$('hStatus').value;
    return ALL.filter(s=>{
      if(f && (!s.delivery_date||s.delivery_date<f))return false;
      if(t && (!s.delivery_date||s.delivery_date>t))return false;
      if(u && String(s.delivery_unit||'')!==u)return false;
      if(st && String(s.delivery_card_status||'')!==st)return false;
      return true;
    });
  }
  function render(){
    const rows=current();
    if(!rows.length){$('hist').innerHTML='<div class="empty">No submissions match.</div>';return;}
    const admin=IS_ADMIN();
    const body=rows.map(s=>{const stc=s.status==='REJECTED'?'bad':'ok';
      return '<tr>'+td(new Date(s.created_at).toLocaleDateString())+td(s.card_holder_name)+td(s.delivery_name)+td(s.staff_id)+
        td(s.branch_code)+td(s.delivery_unit)+td(s.delivery_date)+td(s.delivery_card_status)+td(s.remark)+
        '<td><span class="pill '+stc+'">'+escHtml(s.status)+'</span></td>'+
        '<td style="white-space:nowrap"><button class="btn-xs" style="background:var(--ok)" data-hedit="'+s.id+'">Edit</button>'+
        (admin?' <button class="btn-xs" style="background:var(--danger)" data-hdel="'+s.id+'">Remove</button>':'')+'</td></tr>';}).join('');
    $('hist').innerHTML='<div style="overflow-x:auto"><table class="htable"><thead><tr>'+head.concat(['Actions']).map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
    $('hist').querySelectorAll('[data-hedit]').forEach(b=>b.onclick=()=>{
      const s=ALL.find(x=>String(x.id)===b.getAttribute('data-hedit')); if(!s)return;
      editModal('Edit delivery record — '+(s.card_holder_name||''),[
        {key:'branch_code',label:'Branch Code (numbers only)',value:s.branch_code},
        {key:'delivery_name',label:'Delivery Name',value:s.delivery_name},
        {key:'staff_id',label:'Staff ID (numbers only)',value:s.staff_id},
        {key:'delivery_unit',label:'Delivery by (Unit)',value:s.delivery_unit,type:'select',options:OPTIONS.unit},
        {key:'delivery_date',label:'Delivery Date',value:s.delivery_date,type:'date'},
        {key:'delivery_card_status',label:'Credit Card Status',value:s.delivery_card_status,type:'select',options:OPTIONS.cardStatus},
        {key:'remark',label:'Remark',value:s.remark,type:'textarea',hint:'Required when the status is not "Delivered".'}
      ],async v=>{
        for(const k of ['branch_code','delivery_name','staff_id','delivery_unit','delivery_date','delivery_card_status']) if(!v[k]) return 'Please fill in all required information.';
        if(!/^\d+$/.test(v.branch_code)) return 'Branch Code must be a number.';
        if(!/^\d+$/.test(v.staff_id)) return 'Staff ID must be a number.';
        if(v.delivery_card_status.toLowerCase()!=='delivered' && !v.remark) return 'Remark is required when the status is not "Delivered".';
        v.remark=v.remark||null;
        const {error}=await sb.from('submissions').update(v).eq('id',s.id);
        if(error) return subErr(error.message);
        popup('Delivery record updated.'); load();
      });
    });
    $('hist').querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{
      const s=ALL.find(x=>String(x.id)===b.getAttribute('data-hdel')); if(!s)return;
      confirmBox('Remove the delivery record for '+(s.card_holder_name||'this card')+'? This cannot be undone.','Remove',async()=>{
        const {error}=await sb.from('submissions').delete().eq('id',s.id);
        if(error) popup(error.message); else load();
      });
    });
  }
  // Conditions are applied when Search is clicked (Search also reloads the latest data).
  $('hSearch').onclick=load;
  ['hFrom','hTo','hUnit','hStatus'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')load();}));
  $('hClear').onclick=()=>{['hFrom','hTo','hUnit','hStatus'].forEach(id=>$(id).value='');load();};
  $('hExport').onclick=()=>{const rows=current().map(s=>[new Date(s.created_at).toLocaleDateString(),s.card_holder_name,s.delivery_name,s.staff_id,s.branch_code,s.delivery_unit,s.delivery_date,s.delivery_card_status,s.remark,s.status]);
    if(!rows.length)return popup('Nothing to export for the current filters.');exportXlsx('history.xlsx',head,rows);};
  load();
}

function viewCards(){
  $('main').innerHTML='<h2>Card Data</h2><div id="setBody"></div>';
  settingsHolder();
}
function viewSettings(){
  const subs=[['users','User Role & Permission'],['branch','Branch Code'],['unit','Delivery by (Unit)'],['status','Credit Card Status']];
  $('main').innerHTML='<h2>Settings</h2><div id="setTabs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">'+
    subs.map(s=>'<button class="setTab" data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'</div><div id="setBody"></div>';
  const tabs=$('setTabs').querySelectorAll('.setTab');
  function open(key){ tabs.forEach(t=>t.classList.toggle('active',t.getAttribute('data-s')===key));
    if(key==='users')settingsUsers(); else settingsRef(key); }
  tabs.forEach(t=>t.onclick=()=>open(t.getAttribute('data-s')));
  open('users');
}
const REFCFG={branch:{table:'ref_branch',label:'Branch Code'},unit:{table:'ref_unit',label:'Delivery by (Unit)'},status:{table:'ref_card_status',label:'Credit Card Status'}};
async function settingsRef(key){
  const c=REFCFG[key], body=$('setBody'), ea=escHtml;
  body.innerHTML='<div class="empty">Loading…</div>';
  const {data,error}=await sb.from(c.table).select('*').order('label');
  if(error){body.innerHTML='<div class="empty">'+error.message+'</div>';return;}
  body.innerHTML='<div style="display:flex;gap:8px;margin-bottom:12px"><input id="newRef" placeholder="Add '+c.label+'…" style="flex:1"><button class="btn-sm" style="background:var(--accent);padding:10px 14px" id="addRef">Add</button></div><div id="refList"></div>';
  $('refList').innerHTML=(data&&data.length)?data.map(r=>'<div class="card" style="display:flex;align-items:center;gap:8px;padding:10px"><span style="flex:1">'+ea(r.label)+'</span><button class="btn-sm" style="background:var(--ok)" data-edit="'+r.id+'">Edit</button><button class="btn-sm" style="background:var(--danger)" data-del="'+r.id+'">Remove</button></div>').join(''):'<div class="empty">No items yet.</div>';
  // Duplicates are rejected (same text, ignoring upper/lower case and extra spaces)
  const normL=x=>String(x==null?'':x).trim().replace(/\s+/g,' ').toLowerCase();
  const dupOf=(v,exceptId)=>(data||[]).find(r=>normL(r.label)===normL(v)&&String(r.id)!==String(exceptId));
  const dupMsg=(v,d)=>'"'+v+'" already exists in '+c.label+(d.label!==v?' (as "'+d.label+'")':'')+'. Duplicates are not allowed.';
  $('addRef').onclick=async()=>{const v=$('newRef').value.trim().replace(/\s+/g,' ');if(!v)return popup('Enter a value.');
    const d=dupOf(v); if(d) return popup(dupMsg(v,d));
    const {error}=await sb.from(c.table).insert({label:v});if(error)popup(/duplicate|unique/i.test(error.message)?'"'+v+'" already exists in '+c.label+'. Duplicates are not allowed.':error.message);else{await loadOptions();settingsRef(key);}};
  $('newRef').addEventListener('keydown',e=>{if(e.key==='Enter')$('addRef').click();});
  body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const id=b.getAttribute('data-edit');const row=(data||[]).find(x=>String(x.id)===id);editModal('Edit '+c.label,[{key:'label',label:c.label,value:row.label}],async v=>{v.label=v.label.replace(/\s+/g,' ');if(!v.label)return 'Enter a value.';const d=dupOf(v.label,id);if(d)return dupMsg(v.label,d);const {error}=await sb.from(c.table).update({label:v.label}).eq('id',id);if(error)return /duplicate|unique/i.test(error.message)?'"'+v.label+'" already exists in '+c.label+'. Duplicates are not allowed.':error.message;await loadOptions();settingsRef(key);});});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from(c.table).delete().eq('id',b.getAttribute('data-del'));if(error)popup(error.message);else{await loadOptions();settingsRef(key);}});
}

function settingsHolder(){
  const body=$('setBody'), admin=IS_ADMIN();
  body.innerHTML='<div class="card" style="padding:12px"><div class="k" style="font-weight:700;margin-bottom:6px">Upload daily card data</div><div id="upWrap"></div></div>'+
    '<div class="card" style="padding:12px"><div class="k" style="font-weight:700;margin-bottom:6px">Add a card</div>'+
      '<label>Customer name (card holder) *</label><input id="ch_name">'+
      '<label>Address</label><input id="ch_addr">'+
      '<label>Creating in TWCMS (date)</label><input id="ch_date" type="date">'+
      '<label>Reason for reissue</label><input id="ch_reason" placeholder="Leave blank for a new card">'+
      '<button class="btn-sm" style="background:var(--accent);margin-top:10px;padding:9px 14px" id="ch_save">Add card</button></div>'+
    '<div id="cBar"></div><div id="chList"></div>';
  const tag=r=>(r.reason_for_reissue&&String(r.reason_for_reissue).trim())?'<span class="pill warn">Reissue</span>':'<span class="pill ok">New</span>';
  const colHead=['Customer name','Type','Address','Create date','Reason','Delivered by','Unit','Delivery date','Card status','Actions'];
  let CARDS=[], LATEST={};
  // Filter bar is built once, so the selected conditions survive a Search/refresh.
  const lab=t=>'<label class="hint" style="margin:0 0 2px">'+t+'</label>';
  $('cBar').innerHTML='<div class="card" style="padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">'+
    '<div style="display:flex;flex-direction:column;flex:1;min-width:200px">'+lab('Card holder')+'<input id="chSearch" placeholder="Search card holder…"></div>'+
    '<div style="display:flex;flex-direction:column">'+lab('From (create date)')+'<input type="date" id="cFrom" style="width:150px"></div>'+
    '<div style="display:flex;flex-direction:column">'+lab('To (create date)')+'<input type="date" id="cTo" style="width:150px"></div>'+
    '<div style="display:flex;flex-direction:column">'+lab('Card status')+'<select id="cStatus" style="width:170px"><option value="">All</option><option value="__none">Not yet submitted</option>'+[...new Set(OPTIONS.cardStatus||[])].sort().map(x=>'<option>'+escHtml(x)+'</option>').join('')+'</select></div>'+
    '<button class="btn-sm" id="cClear" style="background:var(--hint);padding:9px 14px">Clear</button>'+
    '<button class="btn-sm" id="cSearch" style="background:var(--ok);padding:9px 14px">🔍 Search</button>'+
    '<button class="btn-sm" id="cExport" style="background:var(--accent);padding:9px 14px">Export Excel</button></div>';
  function matchRows(){
    const term=$('chSearch').value.trim().toLowerCase();
    const f=$('cFrom').value,t=$('cTo').value,st=$('cStatus').value;
    return CARDS.filter(r=>{
      if(term && !String(r.cardholder_name).toLowerCase().includes(term))return false;
      const l=LATEST[String(r.id)];
      if(f && (!r.create_date||r.create_date<f))return false;
      if(t && (!r.create_date||r.create_date>t))return false;
      if(st==='__none'){ if(l)return false; }
      else if(st && (!l||String(l.delivery_card_status||'')!==st))return false;
      return true;
    });
  }
  function draw(){
    const rows=matchRows(); const esc=s=>(s==null||s===''?'—':escHtml(s));
    $('chList').innerHTML=rows.length?'<div style="overflow-x:auto"><table class="htable"><thead><tr>'+colHead.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
      rows.map(r=>{const l=LATEST[String(r.id)]||{}; const idx=CARDS.indexOf(r);
        return '<tr><td>'+esc(r.cardholder_name)+'</td><td>'+tag(r)+'</td><td>'+esc(r.address)+'</td><td>'+esc(r.create_date)+'</td><td>'+esc(r.reason_for_reissue)+'</td><td>'+esc(l.delivery_name)+'</td><td>'+esc(l.delivery_unit)+'</td><td>'+esc(l.delivery_date)+'</td><td>'+esc(l.delivery_card_status)+'</td>'+
          '<td style="white-space:nowrap"><button class="btn-xs" style="background:var(--ok)" data-edit="'+idx+'">Edit</button>'+
          (admin?' <button class="btn-xs" style="background:var(--danger)" data-delc="'+idx+'">Remove</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No cards match.</div>';
    $('chList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=CARDS[+b.getAttribute('data-edit')];editModal('Edit card',[{key:'cardholder_name',label:'Customer name (card holder)',value:r.cardholder_name},{key:'address',label:'Address',value:r.address},{key:'create_date',label:'Creating in TWCMS (date)',value:r.create_date,type:'date'},{key:'reason_for_reissue',label:'Reason for reissue',value:r.reason_for_reissue,hint:'Leave blank for a new card.'}],async v=>{if(!v.cardholder_name)return 'Customer name is required.';v.create_date=v.create_date||null;v.reason_for_reissue=v.reason_for_reissue||null;const {error}=await sb.from('merchant_card_detail').update(v).eq('id',r.id);if(error)return /duplicate|unique/i.test(error.message)?'This customer already has a new card — add a Reason for reissue.':error.message;load();});});
    $('chList').querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{const r=CARDS[+b.getAttribute('data-delc')];
      confirmBox('Remove the card for '+r.cardholder_name+'? This cannot be undone.','Remove',async()=>{const {error}=await sb.from('merchant_card_detail').delete().eq('id',r.id);if(error)popup(error.message);else load();});});
  }
  async function load(){
    $('chList').innerHTML='<div class="empty">Loading…</div>';
    const [cd,su]=await Promise.all([
      sb.from('merchant_card_detail').select('*').order('cardholder_name').limit(1000),
      sb.from('submissions').select('card_ref,delivery_name,delivery_unit,delivery_date,delivery_card_status,created_at')
    ]);
    if(cd.error){$('chList').innerHTML='<div class="empty">'+escHtml(cd.error.message)+'</div>';return;}
    CARDS=cd.data||[]; LATEST=latestByRef(su.data);
    const sel=$('cStatus'), have=new Set([...sel.options].map(o=>o.value));
    (su.data||[]).map(s=>s.delivery_card_status).filter(x=>x&&!have.has(x)).forEach(x=>{have.add(x);const o=document.createElement('option');o.textContent=x;sel.appendChild(o);});
    draw();
  }
  // Conditions are applied when Search is clicked (Search also reloads the latest data).
  $('cSearch').onclick=load;
  ['chSearch','cFrom','cTo','cStatus'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')load();}));
  $('cClear').onclick=()=>{['chSearch','cFrom','cTo','cStatus'].forEach(id=>$(id).value='');load();};
  $('cExport').onclick=()=>{const rows=matchRows().map(r=>{const l=LATEST[String(r.id)]||{};return [r.cardholder_name,(r.reason_for_reissue&&String(r.reason_for_reissue).trim())?'Reissue':'New',r.address,r.create_date,r.reason_for_reissue,l.delivery_name,l.delivery_unit,l.delivery_date,l.delivery_card_status];});
    if(!rows.length)return popup('Nothing to export for the current filters.');exportXlsx('card_data.xlsx',colHead.slice(0,-1),rows);};
  renderUploader($('upWrap'),()=>load());
  $('ch_save').onclick=async()=>{const name=$('ch_name').value.trim();
    if(!name)return popup('Customer name is required.');
    const row={cardholder_name:name,address:$('ch_addr').value.trim(),create_date:$('ch_date').value||null,reason_for_reissue:$('ch_reason').value.trim()||null};
    const {error}=await sb.from('merchant_card_detail').insert(row);
    if(error)popup(/duplicate|unique/i.test(error.message)?'This customer already has a new card — a new card can exist only once. For another card, add a Reason for reissue.':error.message);
    else{['ch_name','ch_addr','ch_date','ch_reason'].forEach(i=>$(i).value='');load();}};
  load();
}

/* ---------- UPLOADER (reused inside Settings → Card Holder Name) ---------- */
function renderUploader(host,onDone){
  host.innerHTML=
    '<p class="hint">Upload the daily card list (CSV or Excel). Each row adds a card. A customer can have one <b>new</b> card (blank reason) plus any number of <b>reissues</b>. Columns: <b>cardholder_name / customer name</b> (required), address, create_date (creating in TWCMS), reason_for_reissue (blank = new).</p>'+
    '<input type="file" id="f_file" accept=".csv,.xlsx,.xls" style="margin-top:6px">'+
    '<div id="upPrev"></div>'+
    '<button class="primary" id="upBtn" disabled>Upload &amp; merge</button>'+
    '<div class="msg" id="upMsg"></div>';
  let parsed=null;
  const FIELDS=['cardholder_name','address','create_date','reason_for_reissue'];
  const MAP={cardholdername:'cardholder_name',customername:'cardholder_name',customer:'cardholder_name',name:'cardholder_name',cardholder:'cardholder_name',address:'address',location:'address',createdate:'create_date',creatingintwcms:'create_date',createdintwcms:'create_date',createddate:'create_date',twcms:'create_date',reasonforreissue:'reason_for_reissue',reissuereason:'reason_for_reissue',reason:'reason_for_reissue',reissue:'reason_for_reissue'};
  const norm=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,'');
  $('f_file').onchange=function(){
    const file=this.files&&this.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!raw.length){ popup('The file has no rows.'); return; }
      parsed=raw.map(row=>{const o={};Object.keys(row).forEach(k=>{const n=norm(k);const f=MAP[n]||(FIELDS.indexOf(n)>=0?n:null);if(f)o[f]=typeof row[k]==='string'?row[k].trim():row[k];});return o;}).filter(o=>o.cardholder_name);
      if(!parsed.length){ popup('No valid rows found. The file needs a cardholder_name (customer name) column.'); return; }
      $('upPrev').innerHTML='<div class="card" style="margin-top:10px">'+kv('Rows found',parsed.length)+kv('Sample',parsed.slice(0,3).map(p=>p.cardholder_name+(p.reason_for_reissue?' (reissue)':' (new)')).join(', '))+'</div>';
      $('upBtn').disabled=false;
    }catch(err){ popup('Could not read the file: '+err.message); } };
    r.readAsArrayBuffer(file);
  };
  $('upBtn').onclick=async function(){
    if(!parsed||!parsed.length)return; this.disabled=true; setMsg('upMsg','ok','Uploading…');
    const {data:existing}=await sb.from('merchant_card_detail').select('cardholder_name,reason_for_reissue');
    const newNames=new Set((existing||[]).filter(r=>!(r.reason_for_reissue&&String(r.reason_for_reissue).trim())).map(r=>String(r.cardholder_name).trim().toLowerCase()));
    let toInsert=[],skipped=0;
    parsed.forEach(p=>{const reason=(p.reason_for_reissue&&String(p.reason_for_reissue).trim())||null;const isNew=!reason;const key=String(p.cardholder_name).trim().toLowerCase();
      if(isNew&&newNames.has(key)){skipped++;return;} if(isNew)newNames.add(key);
      toInsert.push({cardholder_name:p.cardholder_name,address:p.address||null,create_date:p.create_date||null,reason_for_reissue:reason});});
    let error=null; if(toInsert.length){ const res=await sb.from('merchant_card_detail').insert(toInsert); error=res.error; }
    this.disabled=false;
    if(error){ setMsg('upMsg','bad',error.message); popup('Upload failed: '+error.message); }
    else { setMsg('upMsg','ok',toInsert.length+' added'+(skipped?', '+skipped+' skipped (new card already exists)':'')+'.'); $('f_file').value=''; $('upPrev').innerHTML=''; if(onDone)onDone(); }
  };
}

/* Change my own password: current password + new password (at least 6 characters) */
function passwordModal(){
  const L=t=>'<label style="display:block;font-size:12.5px;color:#374151;font-weight:600;margin:10px 0 4px">'+t+' <span class="req">*</span></label>';
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2500;padding:16px';
  o.innerHTML='<div style="background:#fff;color:#1a1a1a;border-radius:12px;max-width:400px;width:100%;padding:18px">'+
    '<div style="font-weight:700;font-size:16px;margin-bottom:4px">🔒 Change password</div>'+
    L('Current password')+'<input id="cp_old" type="password" autocomplete="current-password">'+
    L('New password')+'<input id="cp_new" type="password" autocomplete="new-password" placeholder="At least 6 characters">'+
    L('Confirm new password')+'<input id="cp_new2" type="password" autocomplete="new-password">'+
    '<label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:8px"><input type="checkbox" id="cp_show" style="width:auto"> Show passwords</label>'+
    '<div class="msg" id="cp_msg"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn-sm" id="cp_cancel" style="flex:1;background:#6b7280;padding:10px">Cancel</button><button class="btn-sm" id="cp_save" style="flex:1;background:var(--accent);padding:10px">Save</button></div></div>';
  document.body.appendChild(o);
  const q=x=>o.querySelector(x), close=()=>o.remove();
  const bad=t=>{const m=q('#cp_msg');m.className='msg show bad';m.textContent=t;};
  q('#cp_cancel').onclick=close; o.addEventListener('click',e=>{if(e.target===o)close();});
  q('#cp_show').onchange=function(){['#cp_old','#cp_new','#cp_new2'].forEach(s=>q(s).type=this.checked?'text':'password');};
  ['#cp_old','#cp_new','#cp_new2'].forEach(s=>q(s).addEventListener('keydown',e=>{if(e.key==='Enter')q('#cp_save').click();}));
  q('#cp_save').onclick=async function(){
    const oldp=q('#cp_old').value, np=q('#cp_new').value, np2=q('#cp_new2').value;
    if(!oldp) return bad('Enter your current password.');
    if(np.length<6) return bad('New password must be at least 6 characters.');
    if(np!==np2) return bad('The new passwords do not match.');
    if(np===oldp) return bad('The new password must be different from the current one.');
    this.disabled=true;
    const email=(PROFILE&&PROFILE.email)||(ME&&ME.email);
    const {error:ve}=await sb.auth.signInWithPassword({email,password:oldp});   // confirm it's really you
    if(ve){ this.disabled=false; return bad('Current password is incorrect.'); }
    const {error}=await sb.auth.updateUser({password:np});
    this.disabled=false;
    if(error) return bad(error.message);
    close(); popup('Password changed. Use the new password next time you sign in.');
  };
  setTimeout(()=>q('#cp_old').focus(),50);
}

    '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn-sm" id="pm_cancel" style="flex:1;background:#6b7280;padding:10px">Cancel</button>'+

      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);

      else { await sb.from('profiles').update({email:em}).eq('id',ME.id); PROFILE.email=em; note=' Check your inbox to confirm the new email.'; }

    close(); viewProfile(); popup('Profile updated.'+note);
  };
}

/* Searchable dropdown: type a keyword to filter the list, arrow keys / Enter / Tab
   or click to pick. Free typing is still allowed (e.g. a branch not in the list). */
function comboBox(input,list,getOptions){
  let shown=[],idx=-1;
  function draw(){
    const q=input.value.trim().toLowerCase();
    const all=(getOptions()||[]).map(String);
    shown=q?all.filter(o=>o.toLowerCase().includes(q)):all;
    idx=shown.length?0:-1;
    list.innerHTML=shown.length?shown.map((o,i)=>'<div class="combo-opt'+(i===idx?' on':'')+'" data-i="'+i+'">'+escHtml(o)+'</div>').join('')
      :'<div class="combo-empty">'+(q?'No match — "'+escHtml(input.value.trim())+'" will be used':'No options')+'</div>';
    list.classList.add('open');
  }
  function hi(){ list.querySelectorAll('.combo-opt').forEach((el,i)=>el.classList.toggle('on',i===idx)); const el=list.querySelector('.combo-opt.on'); if(el)el.scrollIntoView({block:'nearest'}); }
  function choose(i){ if(i>=0&&shown[i]!=null){ input.value=shown[i]; } list.classList.remove('open'); }
  input.addEventListener('focus',draw);
  input.addEventListener('input',draw);
  input.addEventListener('keydown',e=>{
    if(!list.classList.contains('open')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){draw();e.preventDefault();return;}
    if(e.key==='ArrowDown'){ if(shown.length){idx=(idx+1)%shown.length;hi();} e.preventDefault(); }
    else if(e.key==='ArrowUp'){ if(shown.length){idx=(idx-1+shown.length)%shown.length;hi();} e.preventDefault(); }
    else if(e.key==='Enter'){ if(list.classList.contains('open')&&idx>=0){choose(idx);e.preventDefault();} }
    else if(e.key==='Tab'){ if(list.classList.contains('open')&&idx>=0&&input.value.trim()&&shown[idx].toLowerCase()!==input.value.trim().toLowerCase())choose(idx); else list.classList.remove('open'); }
    else if(e.key==='Escape'){ list.classList.remove('open'); }
  });
  list.addEventListener('mousedown',e=>{ const el=e.target.closest('.combo-opt'); if(el){ e.preventDefault(); choose(+el.getAttribute('data-i')); } });
  input.addEventListener('blur',()=>setTimeout(()=>list.classList.remove('open'),120));
}

/* Copy text to the clipboard (with a fallback for older webviews) */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}

function subErr(m){ m=String(m||'');
  if(/\bDUP\b/.test(m)) return 'This card has already been submitted. Only "On Hold" cards can be submitted again.';
  if(/duplicate|unique/i.test(m)) return 'This card has already been submitted.';
  if(/NO_MATCH/.test(m))   return 'Card holder does not match the existing data.';
  if(/BAD_BRANCH/.test(m)) return 'Branch Code must be a number.';
  if(/BAD_STAFF/.test(m))  return 'Staff ID must be a number.';
  if(/BAD_DATE/.test(m))   return 'Delivery Date cannot be earlier than the card\'s create date.';
  if(/NEED_REMARK/.test(m))return 'Remark is required when the status is not "Delivered".';
  return m;
}

      if(st.op==='upsert'){
        const arr=Array.isArray(st.payload)?st.payload:[st.payload];
        if(st.table==='merchant_card_detail') arr.forEach(row=>{const i=row.id!=null?cards.findIndex(c=>String(c.id)===String(row.id)):-1;if(i>=0)Object.assign(cards[i],row);else cards.push(Object.assign({id:'x'+Date.now()+Math.floor(Math.random()*1000)},row));});
        return {error:null};
      }
      if(st.op==='insert'){
        const p=st.payload;
        if(st.table==='submissions'){
          const m=cards.find(c=>String(c.id)===String(p.card_ref));
          if(!m) return {error:{message:'NO_MATCH card not in uploaded data'}};
          if(subs.some(s=>String(s.card_ref)===String(p.card_ref))) return {error:{message:'duplicate: card already submitted'}};
          subs.unshift({id:Date.now(),created_at:new Date().toISOString(),submitted_by:'public',status:'SUBMITTED',card_ref:p.card_ref,
            card_holder_name:m.cardholder_name,branch_code:p.branch_code,delivery_name:p.delivery_name,staff_id:p.staff_id,
            delivery_unit:p.delivery_unit,delivery_date:p.delivery_date,delivery_card_status:p.delivery_card_status,remark:p.remark});
          return {error:null};
        }
        const arr=Array.isArray(p)?p:[p]; const a=db[st.table];
        if(st.table==='merchant_card_detail'){ for(const row of arr){ const isNew=!(row.reason_for_reissue&&String(row.reason_for_reissue).trim()); if(isNew&&cards.some(c=>String(c.cardholder_name).trim().toLowerCase()===String(row.cardholder_name).trim().toLowerCase()&&!(c.reason_for_reissue&&String(c.reason_for_reissue).trim()))) return {error:{message:'duplicate: new card already exists'}}; } }
        if(a) arr.forEach(row=>a.unshift(Object.assign({id:'x'+Date.now()+Math.floor(Math.random()*1000),created_at:new Date().toISOString()},row)));
        return {error:null};
      }
      let rows=db[st.table].slice();
      if(st.op==='update'){
        db[st.table].filter(r=>st.filters.every(([c,v])=>String(r[c])===String(v))).forEach(r=>Object.assign(r,st.payload));
        return {error:null};
      }
      st.filters.forEach(([c,v])=>rows=rows.filter(r=>String(r[c])===String(v)));
      st.ilikes.forEach(([c,v])=>{const term=String(v).replace(/%/g,'').toLowerCase();rows=rows.filter(r=>String(r[c]).toLowerCase().includes(term));});
      if(st.limitN)rows=rows.slice(0,st.limitN);
      return st.single?{data:rows[0]||null,error:null}:{data:rows,error:null};
    }catch(e){return {error:{message:String(e)}};}
  }
  function builder(table){
    const st={table,op:'select',filters:[],ilikes:[],limitN:null,single:false,payload:null};
    const api={select(){return api;},insert(p){st.op='insert';st.payload=p;return api;},upsert(p){st.op='upsert';st.payload=p;return api;},
      update(p){st.op='update';st.payload=p;return api;},delete(){st.op='delete';return api;},eq(c,v){st.filters.push([c,v]);return api;},
      ilike(c,v){st.ilikes.push([c,v]);return api;},order(){return api;},limit(n){st.limitN=n;return api;},
      single(){st.single=true;return api;},then(res){res(run(st));}};
    return api;
  }
  let _session=null,_cb=null;
  return { from:builder, auth:{
    getSession:async()=>({data:{session:_session}}),
    onAuthStateChange:(cb)=>{_cb=cb;return {data:{subscription:{unsubscribe(){}}}};},
    signInWithPassword:async({email})=>{_session={user:{id:'demo-admin',email:email||'demo@admin'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    signUp:async({email})=>{_session={user:{id:'demo-signup',email:email||'new@user'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    signOut:async()=>{_session=null;if(_cb)_cb('SIGNED_OUT',null);return {error:null};},
    resetPasswordForEmail:async()=>({error:null}),
    signInWithOtp:async()=>({error:null}),
    verifyOtp:async({email})=>{_session={user:{id:'demo-admin',email:email||'demo@admin'}};if(_cb)_cb('SIGNED_IN',_session);return {error:null};},
    updateUser:async()=>({error:null})
  }, rpc:async(name)=>({data:(name==='email_for_staff'?'demo@admin':null),error:null}) };
}

/* theme toggle */
function applyTheme(t){ document.body.classList.toggle('dark', t==='dark'); const b=$('themeBtn'); if(b)b.textContent=t==='dark'?'\u2600\uFE0F':'\uD83C\uDF19'; }
(function(){ let t='light'; try{t=localStorage.getItem('cc_theme')||'light';}catch(e){} applyTheme(t); })();
if($('themeBtn')) $('themeBtn').onclick=function(){ const dark=!document.body.classList.contains('dark'); const t=dark?'dark':'light'; try{localStorage.setItem('cc_theme',t);}catch(e){} applyTheme(t); };
boot();
